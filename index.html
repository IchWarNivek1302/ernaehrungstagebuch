function weights(){return (S.data.weights||[]).slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));}
function kgAt(list,dateISO){let v=null;for(const w of list){if(w.date<=dateISO)v=w.kg;else break;}return v;}
const kg1=v=>v===null||v===undefined?'–':nf1.format(v);
const parseKg=v=>{const n=parseFloat(String(v||'').replace(',','.'));return n>20&&n<400?Math.round(n*10)/10:null;};
/* Zeitraum des Graphen */
const W_RANGES=[[30,'30 T'],[90,'90 T'],[365,'Jahr'],[0,'Alle']];
function weightChart(list){
  const t=today(),range=S.wRange===undefined?90:S.wRange;
  const first=list.length?list[0].date:t,from=range?addDays(t,-range+1):first;
  const pts=list.filter(w=>w.date>=from&&w.date<=t);
  if(pts.length<2)return `<div class="faint small" style="padding:24px 0;text-align:center">${pts.length?'Ab zwei Einträgen in diesem Zeitraum':'Noch keine Werte in diesem Zeitraum'} erscheint hier die Kurve.</div>`;
  /* ein Wert pro Tag (der letzte), dazu 7-Tage-Schnitt */
  const byDay=new Map();pts.forEach(p=>byDay.set(p.date,p.kg));const days=[...byDay.entries()];
  const W=340,H=180,pl=34,pr=10,pt=12,pb=22,goal=g2().weight||0;
  let lo=Math.min(...days.map(d=>d[1])),hi=Math.max(...days.map(d=>d[1]));
  if(goal&&goal>lo-4&&goal<hi+4){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1;}
  lo=Math.floor(lo-0.3);hi=Math.ceil(hi+0.3);
  const t0=parse(range?from:days[0][0]).getTime(),t1=parse(t).getTime(),span=Math.max(1,t1-t0);
  const x=d=>pl+(W-pl-pr)*((parse(d).getTime()-t0)/span),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const avg=days.map(([d])=>{const s=days.filter(([e])=>e<=d&&e>addDays(d,-7));return [d,s.reduce((a,q)=>a+q[1],0)/s.length];});
  const path=a=>a.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  const steps=hi-lo<=4?1:hi-lo<=10?2:5;let ticks='';for(let v=Math.ceil(lo/steps)*steps;v<=hi;v+=steps)ticks+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3.5}" font-size="10" text-anchor="end" fill="var(--faint)">${v}</text>`;
  const labD=[days[0][0],days[Math.floor(days.length/2)][0],t].filter((d,i,a)=>a.indexOf(d)===i);
  const xl=labD.map((d,i)=>`<text x="${Math.min(W-pr-14,Math.max(pl+14,x(d)))}" y="${H-5}" font-size="10" text-anchor="middle" fill="var(--faint)">${shortDate(d)}</text>`).join('');
  const gl=goal?`<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--prot)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(goal)-5}" font-size="10" text-anchor="end" fill="var(--prot)">Ziel ${nf1.format(goal)}</text>`:'';
  S.wGeo={W,H,pl,pt,pb,pts:days.map(([d,v],i)=>[+x(d).toFixed(1),+y(v).toFixed(1),d,v,avg[i][1]])};
  const dots=days.length<=60?days.map(([d,v])=>`<circle cx="${x(d).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="var(--card)" stroke="var(--brand)" stroke-width="1.6"/>`).join(''):'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">${ticks}${gl}<path d="${path(days)}" fill="none" stroke="var(--brand)" stroke-opacity=".28" stroke-width="1.5"/><path d="${path(avg)}" fill="none" stroke="var(--brand)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}<g id="wtTip"></g></svg>`;
}

  }
  if(!goal)h+=`<p class="hint">Ein Zielgewicht kannst du in den Einstellungen eintragen.</p>`;

/* Mehrere Werte: eine Zeile pro Tag, z. B. "12.11. 83,4" */
function parseBulk(txt){
  const out=[],bad=[],y=new Date().getFullYear();
  String(txt||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    let m=l.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?\s*[:;,]?\s+(\d{2,3}(?:[.,]\d+)?)/),d=null,kg=null;
    if(m){let yy=m[3]?+m[3]:y;if(yy<100)yy+=2000;d=yy+'-'+pad(+m[2])+'-'+pad(+m[1]);kg=parseKg(m[4]);if(!m[3]&&d>today())d=(yy-1)+d.slice(4);}
    else if((m=l.match(/^(\d{4})-(\d{2})-(\d{2})\s*[:;,]?\s+(\d{2,3}(?:[.,]\d+)?)/))){d=m[1]+'-'+m[2]+'-'+m[3];kg=parseKg(m[4]);}
    if(d&&kg&&!isNaN(parse(d)))out.push({date:d,time:'',kg,note:''});else bad.push(l);
  });
  return {out,bad};
}

/* ---- Trends (in den Einstellungen wählbar) ---- */
const W_TRENDS=[
  ['d7','Seit 7 Tagen','Letzte Wiegung gegen den Wert vor einer Woche'],
  ['d30','Seit 30 Tagen','Letzte Wiegung gegen den Wert vor einem Monat'],
  ['lastN','Letzte Wiegungen gegen Schnitt davor','Schnitt der letzten Wiegungen gegen den Schnitt der Tage davor (unten einstellbar)'],
  ['avg7','Wochenschnitt','Schnitt dieser 7 Tage gegen die 7 Tage davor, glättet Wasser-Schwankungen'],
  ['month','Monatsschnitt','Schnitt dieses Monats gegen den Vormonat'],
  ['tempo','Tempo','kg pro Woche, berechnet aus den letzten 4 Wochen'],
  ['prog','Prognose Ziel','Wann du beim aktuellen Tempo dein Zielgewicht erreichst'],
  ['tdee','Geschätzter Verbrauch','Aus deinem Essen und dem Gewichtstrend der letzten 4 Wochen'],
  ['start','Seit Beginn','Erste Wiegung gegen jetzt'],
  ['minmax','Tief und Hoch','Niedrigster und höchster Wert der letzten 30 Tage'],
  ['freq','Regelmäßigkeit','Wiegungen in den letzten 30 Tagen']];
const W_TREND_DEF=['d7','d30','lastN','tempo'];
const wCfg=()=>Object.assign({trends:W_TREND_DEF,n:3,m:14},S.data.settings.weight||{});
function dailyW(list){const m=new Map();list.forEach(w=>m.set(w.date,w.kg));return [...m.entries()].map(([date,kg])=>({date,kg}));}
const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
function wRegress(days,n){
  const t=today(),from=addDays(t,-n+1),pts=days.filter(d=>d.date>=from);
  if(pts.length<4)return null;
  const xs=pts.map(p=>(parse(p.date)-parse(from))/864e5),ys=pts.map(p=>p.kg);
  if(Math.max(...xs)-Math.min(...xs)<10)return null;
  const mx=mean(xs),my=mean(ys);let a=0,b=0;xs.forEach((x,i)=>{a+=(x-mx)*(ys[i]-my);b+=(x-mx)*(x-mx);});
  const slope=a/b;return {slope,now:my+slope*((parse(t)-parse(from))/864e5-mx),n:pts.length};
}
function trendTiles(list){
  const c=wCfg(),days=dailyW(list),last=list[list.length-1],t=today(),goal=g2().weight||0;
  const sgn=v=>(v>0?'+':v<0?'−':'±')+nf1.format(Math.abs(v));
  const col=v=>v===null?'':(goal&&last&&last.kg<goal)?(v>0?'color:var(--brand)':v<0?'color:var(--warn)':''):(v<0?'color:var(--brand)':v>0?'color:var(--warn)':'');
  const tile=(l,v,sub,style)=>`<div class="tt"><small>${l}</small><b class="num" style="${style||''}">${v}</b>${sub?`<span>${sub}</span>`:''}</div>`;
  const dtile=(l,d,sub)=>tile(l,d===null?'–':sgn(d)+' kg',d===null?'zu wenig Werte':sub,col(d));
  const reg=wRegress(days,28);
  const out=[];
  c.trends.forEach(key=>{
    if(key==='d7'||key==='d30'){const n=key==='d7'?7:30;const v=last?kgAt(list,addDays(last.date,-n)):null;out.push(dtile('seit '+n+' Tagen',v===null?null:last.kg-v,'gegen '+kg1(v)+' kg'));}
    else if(key==='lastN'){const r=days.slice(-c.n);let d=null,sub='';if(r.length===c.n){const before=days.filter(x=>x.date<r[0].date&&x.date>=addDays(r[0].date,-c.m));const a=mean(r.map(x=>x.kg)),b=mean(before.map(x=>x.kg));if(b!==null){d=a-b;sub='Ø '+kg1(a)+' gegen Ø '+kg1(b);}}
      out.push(dtile('letzte '+c.n+' gegen '+c.m+' Tage davor',d,sub));}
    else if(key==='avg7'){const a=mean(days.filter(x=>x.date>addDays(t,-7)).map(x=>x.kg)),b=mean(days.filter(x=>x.date>addDays(t,-14)&&x.date<=addDays(t,-7)).map(x=>x.kg));out.push(dtile('Wochenschnitt',a!==null&&b!==null?a-b:null,a!==null?'Ø '+kg1(a)+' kg':''));}
    else if(key==='month'){const m0=t.slice(0,7),pm=addDays(m0+'-01',-1).slice(0,7);const a=mean(days.filter(x=>x.date.startsWith(m0)).map(x=>x.kg)),b=mean(days.filter(x=>x.date.startsWith(pm)).map(x=>x.kg));out.push(dtile('Monatsschnitt',a!==null&&b!==null?a-b:null,a!==null?'Ø '+kg1(a)+' kg':''));}
    else if(key==='tempo'){out.push(reg?tile('Tempo',sgn(reg.slope*7)+' kg','pro Woche',col(reg.slope)):tile('Tempo','–','ab 4 Wiegungen in 4 Wochen'));}
    else if(key==='prog'){
      if(!goal)out.push(tile('Prognose Ziel','–','Zielgewicht fehlt'));
      else if(!reg)out.push(tile('Prognose Ziel','–','zu wenig Werte'));
      else{const need=goal-reg.now;if(Math.abs(need)<0.3)out.push(tile('Prognose Ziel','erreicht','',"color:var(--brand)"));
        else if(Math.sign(need)!==Math.sign(reg.slope)||Math.abs(reg.slope)<0.005)out.push(tile('Prognose Ziel','–','beim aktuellen Tempo nicht'));
        else{const dd=Math.round(need/reg.slope);out.push(tile('Prognose Ziel',dd>730?'über 2 Jahre':shortDate(addDays(t,dd)),dd>730?'':'in etwa '+(dd<60?dd+' Tagen':Math.round(dd/7)+' Wochen')));}}}
    else if(key==='tdee'){
      const ks=[];for(let i=1;i<=28;i++){const d=day(addDays(t,-i));if(d.n)ks.push(d.kcal);}
      if(!reg||ks.length<10)out.push(tile('Verbrauch geschätzt','–','braucht 10 Tage Essen und 4 Wiegungen'));
      else{const v=Math.round((mean(ks)-reg.slope*7700)/10)*10;out.push(tile('Verbrauch geschätzt','≈ '+k(v),'kcal pro Tag (Ø gegessen '+k(mean(ks))+')'));}}
    else if(key==='start'){const f=list[0];out.push(dtile('seit Beginn',f&&last&&f!==last?last.kg-f.kg:null,f?'seit '+shortDate(f.date):''));}
    else if(key==='minmax'){const r=days.filter(x=>x.date>addDays(t,-30)).map(x=>x.kg);out.push(tile('Tief / Hoch 30 T',r.length?kg1(Math.min(...r))+' / '+kg1(Math.max(...r)):'–',r.length?'Spanne '+nf1.format(Math.max(...r)-Math.min(...r))+' kg':''));}
    else if(key==='freq'){const n=days.filter(x=>x.date>addDays(t,-30)).length;out.push(tile('Wiegungen 30 T',String(n),n>=12?'sehr regelmäßig':n>=4?'etwa '+nf1.format(n/30*7)+' pro Woche':'öfter wiegen macht die Trends genauer'));}
  });
  return out.length?`<div class="card"><div class="ch-h"><h3 style="margin:0">Trends</h3><button class="linkbtn" data-act="wTrendCfg" style="margin:0">Anpassen</button></div><div class="tts">${out.join('')}</div></div>`:'';
}

/* ---- Antippen im Graphen zeigt den Wert ---- */
function wTip(svg,clientX){
  const g=S.wGeo;if(!g||!g.pts.length)return;
  const r=svg.getBoundingClientRect(),x=(clientX-r.left)/r.width*g.W;
  let best=g.pts[0];for(const p of g.pts)if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p;
  const [px,py,d,kg,av]=best,tip=svg.querySelector('#wtTip');if(!tip)return;

const SCAN={stream:null,timer:null,det:null};
function stopScan(){

function scanHtml(){

      `<p class="sub">Dein Browser kann hier keine Barcodes live lesen (z. B. Safari auf dem iPhone). ${typeof hasAI==='function'&&hasAI()?'Fotografier den Strichcode, die KI liest die Nummer, oder tipp sie ein.':'Gib die Nummer unter dem Strichcode einfach ein.'}</p>
      ${typeof hasAI==='function'&&hasAI()?`<label class="ph-pick" style="padding:12px">${ICON.camera}<span>Strichcode fotografieren</span><input type="file" accept="image/*" capture="environment" id="eanFoto" hidden></label>`:''}`}

}
function startScan(){
  const v=$('#scanVid');if(!v)return;
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(st=>{
    if(!$('#scanVid')){st.getTracks().forEach(t=>t.stop());return;}
    SCAN.stream=st;v.srcObject=st;v.play();$('#scanMsg').textContent='Strichcode in den Rahmen halten';
    SCAN.det=SCAN.det||new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    SCAN.timer=setInterval(()=>{
      if(v.readyState<2)return;
      SCAN.det.detect(v).then(c=>{if(c&&c.length&&SCAN.timer){const code=c[0].rawValue;stopScan();vibe(30);lookupEan(code);}}).catch(()=>{});
    },220);
  }).catch(e=>{const m=$('#scanMsg');if(m)m.textContent='Kein Kamerazugriff. Bitte in Chrome erlauben oder die Nummer eingeben.';});
}
const SWEET={sucralose:'Sucralose',aspartam:'Aspartam',acesulfam:'Acesulfam K',steviolglycosid:'Steviolglycoside',stevia:'Stevia',cyclamat:'Cyclamat',saccharin:'Saccharin',neotam:'Neotam',erythrit:'Erythrit',maltit:'Maltit',sorbit:'Sorbit',xylit:'Xylit',isomalt:'Isomalt',lactit:'Lactit'};
function sweetFrom(txt){
  if(!txt)return '';const t=norm(txt),hit=[];
  for(const k in SWEET)if(t.includes(k)&&!hit.includes(SWEET[k]))hit.push(SWEET[k]);
  return hit.length?'ja ('+hit.join(', ')+')':'nein';
}
function lookupEan(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length<8){toast('Bitte eine gültige Barcode-Nummer eingeben.',true);return;}
  const local=S.foods&&S.foods.find(x=>String(x.f[10]).includes(code));
  if(local){pickScanned(local.f,code,true);return;}
  const A=S.add;A.step='scanwait';
  openSheet(`<button class="back" data-act="addback">${ICON.back}Zurück</button><h2>Suche Produkt …</h2><p class="sub">Barcode ${esc(code)}</p><div class="loading" style="height:120px"><div class="sp"></div></div>`);
  const f='product_name,product_name_de,generic_name_de,brands,nutriments,serving_quantity,serving_size,ingredients_text_de,ingredients_text';
  fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields='+f).then(r=>r.json()).then(j=>{
    const p=j&&j.status===1&&j.product,n=p&&p.nutriments;
    if(!p||!n||n['energy-kcal_100g']===undefined){notFound(code);return;}
    const o=v=>v===undefined||v===null||v===''?null:Math.round(Number(v)*10)/10;
    const ingr=p.ingredients_text_de||p.ingredients_text||'';
    const salt=n.salt_100g!==undefined?o(n.salt_100g):n.sodium_100g!==undefined?o(n.sodium_100g*2.5):null;
    const caff=ingr?(/(koffein|coffein|caffeine|kaffee|guarana|mate|cola|tee\b)/i.test(ingr)?null:0):null;
    const sq=Number(p.serving_quantity)||null;
    const name=(p.product_name_de||p.product_name||p.generic_name_de||'Produkt').trim(),brand=String(p.brands||'').split(',')[0].trim();
    const rec=[name,brand,Math.round(Number(n['energy-kcal_100g'])||0),o(n.proteins_100g)||0,o(n.carbohydrates_100g)||0,o(n.sugars_100g),o(n.fat_100g)||0,o(n.fiber_100g),
      sq?'Portion':'',sq,'Open Food Facts (EAN '+code+')',salt,sweetFrom(ingr),o(n.lactose_100g),caff];

}

/* Gewichtskurve für den Bericht (fester Zeitraum) */
function weightChartFor(list,from,to){
  const W=640,H=200,pl=40,pr=12,pt=12,pb=24;let lo=Math.min(...list.map(w=>w.kg)),hi=Math.max(...list.map(w=>w.kg));
  if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1;}lo=Math.floor(lo-0.3);hi=Math.ceil(hi+0.3);
  const t0=parse(from).getTime(),span=Math.max(1,parse(to).getTime()-t0),x=d=>pl+(W-pl-pr)*((parse(d).getTime()-t0)/span),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let ticks='';for(let v=Math.ceil(lo);v<=hi;v+=hi-lo>8?2:1)ticks+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ddd"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#666">${v}</text>`;
  const path=list.map((w,i)=>(i?'L':'M')+x(w.date).toFixed(1)+' '+y(w.kg).toFixed(1)).join(' ');
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}">${ticks}<path d="${path}" fill="none" stroke="#2E5D50" stroke-width="2.2"/>${list.map(w=>`<circle cx="${x(w.date).toFixed(1)}" cy="${y(w.kg).toFixed(1)}" r="3" fill="#fff" stroke="#2E5D50" stroke-width="1.5"/>`).join('')}
    <text x="${pl}" y="${H-6}" font-size="11" fill="#666">${shortDate(from)}</text><text x="${W-pr}" y="${H-6}" font-size="11" text-anchor="end" fill="#666">${shortDate(to)}</text></svg>`;
}
function readExp(){
  const E=S.exp;E.from=val('expFrom')||E.from;E.to=val('expTo')||E.to;if(E.from>E.to){const t=E.from;E.from=E.to;E.to=t;}
  E.parts=[...document.querySelectorAll('[data-exp]')].filter(i=>i.checked).map(i=>i.dataset.exp);return E;
}
function printReport(){
  const E=readExp();if(!E.parts.length){toast('Bitte mindestens einen Inhalt auswählen.',true);return;}
  ensureOlder(E.from).then(()=>{
    let pr=$('#print');if(!pr){pr=document.createElement('div');pr.id='print';document.body.appendChild(pr);}
    pr.innerHTML=reportHtml(E);document.body.classList.add('printing');closeSheet();
    const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done);};
    window.addEventListener('afterprint',done);
    setTimeout(()=>{try{window.print();}catch(e){toast('Drucken ist hier nicht möglich.',true);done();}},300);
  }).catch(e=>toast(e.message,true));
}
function exportCsv(){
  const E=readExp();
  ensureOlder(E.from).then(()=>{
    const n1=v=>String(Math.round((v||0)*10)/10).replace('.',','),ws=weights();
    const rows=[['Datum','Wochentag','kcal','Eiweiß (g)','Kohlenhydrate (g)','Fett (g)','Ballaststoffe (g)','Zucker (g)','Gewicht (kg)']];
    expDays(E.from,E.to).forEach(s=>{const d=S.by[s];const w=ws.filter(x=>x.date===s).pop();
      if(!(d&&d.n)&&!w)return;
      const sf=f=>MEALS.reduce((a,m)=>a+((d&&d.meals[m])?d.meals[m].items.reduce((b,e)=>b+(+e[f]||0),0):0),0);
      rows.push([s.split('-').reverse().join('.'),DAYS[wd(s)],d&&d.n?Math.round(d.kcal):'',d&&d.n?n1(d.p):'',d&&d.n?n1(d.c):'',d&&d.n?n1(d.f):'',d&&d.n?n1(sf('fiber')):'',d&&d.n?n1(sf('sugar')):'',w?n1(w.kg):'']);});
    const csv='﻿'+rows.map(r=>r.map(c=>/[;"\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(';')).join('\r\n');
    const name='Ernaehrungstagebuch_'+E.from+'_bis_'+E.to+'.csv',file=new File([csv],name,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
    toast((rows.length-1)+' Tage exportiert.');
  }).catch(e=>toast(e.message,true));
}

/* ================= Rezept-Bilder =================
   Bild aus der Galerie wählen, auf dem Handy verkleinern, im eigenen Google Drive ablegen.
   Angezeigt wird eine kleine Version, die sich die App auf dem Handy merkt. */
const IMG_PREFIX='et-img-';
function shrinkImage(file,max,q){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Bild konnte nicht gelesen werden.'));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Dieses Bildformat wird nicht unterstützt.'));
      im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.src=fr.result;};fr.readAsDataURL(file);});
}
function shrinkDataUrl(url,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.onerror=()=>res(null);im.src=url;});}
const imgCache=id=>{if(DEMO_IMG[id])return DEMO_IMG[id];try{return localStorage.getItem(IMG_PREFIX+id);}catch(e){return null;}};
function imgStore(id,url){try{localStorage.setItem(IMG_PREFIX+id,url);}catch(e){/* Speicher voll: Bild wird beim nächsten Mal neu geladen */}}
function recipeImgHtml(name,cls){
  const id=(S.data.images||{})[name];if(!id)return '';
  const c=imgCache(id);
  const cr=(S.data.imgCredits||{})[name];
  return `<div class="rimg ${cls||''}" data-img="${esc(id)}" style="${c?`background-image:url('${c}')`:''}">${c?'':'<span class="sp"></span>'}${cr?`<small class="rcred">Foto: ${esc(cr)}</small>`:''}</div>`;
}

/* Foto + Textleiste darunter: gut lesbar für Claude (dunkle Schrift auf hellem Grund) */
function captionImage(url,text){
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
    const W=Math.min(1600,im.naturalWidth),H=Math.round(im.naturalHeight*W/im.naturalWidth),fs=Math.max(30,Math.round(W/30)),pad=Math.round(fs*0.9);
    const c=document.createElement('canvas'),x=c.getContext('2d');x.font=`600 ${fs}px Arial, sans-serif`;
    const words=('📝 '+text).split(' '),lines=[];let cur='';
    for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>W-pad*2&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);
    const band=pad*2+lines.length*fs*1.3;c.width=W;c.height=H+band;
    x.drawImage(im,0,0,W,H);x.fillStyle='#FFFFFF';x.fillRect(0,H,W,band);x.fillStyle='#1E2320';x.font=`600 ${fs}px Arial, sans-serif`;x.textBaseline='top';
    lines.forEach((l,i)=>x.fillText(l,pad,H+pad+i*fs*1.3));
    c.toBlob(b=>b?res(b):rej(new Error('Bild')),'image/jpeg',0.88);};im.onerror=rej;im.src=url;});
}

/* ================= Kopieren von einer anderen Mahlzeit =================

    <label class="cother"><span>${days.includes(c.d)?'Anderer Tag':dayLabel(c.d)}</span><input type="date" id="cpDay" value="${c.d}" max="${t}"></label>
    <div class="cmeal">${MEALS.map(m=>{const has=day(c.d).meals[m];return `<button type="button" class="${m===c.m?'on':''}" style="--mc:${MEAL_COLOR[m]}" data-act="copyMeal" data-meal="${m}"><i></i>${MEAL_SHORT[m]}${has?` <small class="num">${k(has.kcal)}</small>`:''}</button>`;}).join('')}</div>
    ${groups.length?`<div class="copylist">${groups.map((g,i)=>{const nm=g.single?g.single.name:g.recipe,sub=g.single?g.single.amount:g.amount+' · '+g.rows.length+' Zutaten',kk=g.single?g.single.kcal:g.kcal;

      :`<div class="empty">${dayLabel(c.d)} beim ${MEAL_SHORT[c.m]} ist nichts eingetragen.</div>`}

    <button class="btn" data-act="copyGo" ${on.size&&groups.length?'':'disabled'}>${on.size?(on.size===groups.length?'Alles':'Auswahl')+' kopieren · '+k(kc)+' kcal':'Nichts ausgewählt'}</button>`;
}
function copyGo(){
  const A=S.add,on=new Set(A.copySel.on),rows=S.copyGroups.filter((_,i)=>on.has(i)).flatMap(g=>(g.single?[g.single]:g.rows).map(e=>e.row));

function dataUrlToFile(url,name){const i=url.indexOf(','),h=url.slice(0,i),b=url.slice(i+1);const mime=(h.match(/:([^;,]*)/)||[])[1]||'image/jpeg';const bin=/;base64/.test(h)?atob(b):unescape(encodeURIComponent(decodeURIComponent(b)));const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new File([a],name,{type:mime});}
function saveFile(file){try{const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;}catch(e){return false;}}
function copyText(t){return navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject();}
async function shareOut(o){
  const files=(o.files||[]).filter(Boolean);
  if(navigator.share){
    const d={title:o.title||''};if(o.text)d.text=o.text;
    if(files.length&&navigator.canShare&&navigator.canShare({files}))d.files=files;
    if(d.files||!files.length){try{await navigator.share(d);return;}catch(e){if(e&&e.name==='AbortError')return;}}
  }
  if(files.length&&saveFile(files[0]))toast(o.text?'Bild gespeichert, Text kopiert.':'Bild gespeichert.');
  if(o.text)copyText(o.text).then(()=>{if(!files.length)toast('Text kopiert. In WhatsApp einfügen.');},()=>toast('Teilen ist hier nicht möglich.',true));
}

/* Bild-Karte zeichnen (Rezept oder Einkaufsliste) */
function cssVar(n,f){const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v&&!/^color-mix/.test(v)?v:f;}
function loadImg(src){return new Promise(res=>{if(!src){res(null);return;}const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});}
async function drawCard(o){
  const W=1080,P=72,font=getComputedStyle(document.body).fontFamily||'sans-serif',head=cssVar('--font-head','')||font;
  const brand=cssVar('--brand','#2E5D50'),ink='#1E2320',muted='#6C726E',bg='#FBFAF6',soft=cssVar('--brand-soft','#E3EEE8');
  const img=await loadImg(o.img);const c=document.createElement('canvas'),x=c.getContext('2d');
  const wrap=(t,w,f)=>{x.font=f;const out=[];String(t).split('\n').forEach(par=>{let line='';par.split(' ').forEach(wd=>{const tt=line?line+' '+wd:wd;if(x.measureText(tt).width>w&&line){out.push(line);line=wd;}else line=tt;});out.push(line);});return out;};
  /* erst messen, dann zeichnen */
  const ops=[];let y=0;const imgH=img?Math.round(W*0.56):0;y+=imgH+P*0.8;
  const tl=wrap(o.title,W-2*P,`700 64px ${head}`);ops.push(['lines',tl,`700 64px ${head}`,ink,74]);y+=tl.length*74;
  if(o.sub){const sl=wrap(o.sub,W-2*P,`500 32px ${font}`);ops.push(['gap',14]);ops.push(['lines',sl,`500 32px ${font}`,muted,42]);y+=14+sl.length*42;}
  if(o.chips){ops.push(['gap',30]);ops.push(['chips',o.chips]);y+=30+96;}
  (o.sections||[]).forEach(s=>{ops.push(['gap',46]);ops.push(['h',s.h]);y+=46+52;
    s.rows.forEach((r,i)=>{if(s.type==='text'){const l=wrap(r,W-2*P,`400 31px ${font}`);ops.push(['lines',l,`400 31px ${font}`,muted,42]);y+=l.length*42;}
      else if(s.type==='steps'){const l=wrap(r,W-2*P-64,`400 33px ${font}`);ops.push(['step',i+1,l]);y+=l.length*45+16;}
      else{const l=wrap(r[0],W-2*P-300,`500 33px ${font}`);ops.push(['row',l,r[1]||'']);y+=Math.max(1,l.length)*45+18;}});});
  y+=P;const H=Math.ceil(y);c.width=W;c.height=H;
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  if(img){const s=Math.max(W/img.width,imgH/img.height),iw=img.width*s,ih=img.height*s;x.drawImage(img,(W-iw)/2,(imgH-ih)/2,iw,ih);}
  else{x.fillStyle=soft;x.fillRect(0,0,W,14);}
  y=imgH+P*0.8;x.textBaseline='top';
  for(const op of ops){
    if(op[0]==='gap')y+=op[1];
    else if(op[0]==='lines'){x.font=op[2];x.fillStyle=op[3];op[1].forEach(l=>{x.fillText(l,P,y);y+=op[4];});}
    else if(op[0]==='chips'){const n=op[1].length,gap=16,cw=(W-2*P-gap*(n-1))/n;op[1].forEach((ch,i)=>{const cx=P+i*(cw+gap);x.fillStyle=soft;x.beginPath();x.roundRect?x.roundRect(cx,y,cw,96,22):x.rect(cx,y,cw,96);x.fill();
      x.fillStyle=muted;x.font=`600 24px ${font}`;x.fillText(ch[0],cx+22,y+16);x.fillStyle=ink;x.font=`700 38px ${head}`;x.fillText(ch[1],cx+22,y+46);});y+=96;}
    else if(op[0]==='h'){x.fillStyle=brand;x.font=`700 30px ${font}`;x.fillText(op[1].toUpperCase(),P,y);y+=52;}
    else if(op[0]==='step'){x.fillStyle=soft;x.beginPath();x.arc(P+22,y+20,22,0,7);x.fill();x.fillStyle=brand;x.font=`700 26px ${font}`;x.textAlign='center';x.fillText(String(op[1]),P+22,y+6);x.textAlign='left';
      x.fillStyle=ink;x.font=`400 33px ${font}`;op[2].forEach(l=>{x.fillText(l,P+64,y);y+=45;});y+=16;}
    else if(op[0]==='row'){x.fillStyle=ink;x.font=`500 33px ${font}`;const y0=y;op[1].forEach(l=>{x.fillText(l,P,y);y+=45;});x.fillStyle=muted;x.textAlign='right';x.fillText(op[2],W-P,y0);x.textAlign='left';
      y+=6;x.fillStyle='rgba(0,0,0,.07)';x.fillRect(P,y,W-2*P,2);y+=12;}
  }
  x.fillStyle=muted;x.font=`500 22px ${font}`;x.textAlign='right';x.fillText('Ernährungstagebuch',W-P,H-44);x.textAlign='left';
  return new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',0.9));
}

          <span class="pn"><b>${esc(it.name)}</b><small class="num">${it.type==='text'?'eigener Eintrag':fmtN(it.portions||1)+' Port.'}${vv.kcal?' · '+k(vv.kcal)+' kcal':''}${miss?' · Rezept fehlt':''}</small></span>${it.done&&!tgt?`<span class="pok" title="eingetragen">${ICON.check}</span>`:''}</button>${tgt?`<button class="pcopy" data-act="planCopyOne" data-d="${d}" data-id="${it.id}" data-to="${tgt}" title="In KW ${isoWeek(tgt)} übernehmen" aria-label="${esc(it.name)} in KW ${isoWeek(tgt)} übernehmen">${ICON.plus}</button>`:''}</div>`;}).join('')}

function instrBlock(ins,open){
  return `<details class="pinstr" ${open?'open':''} data-pins="1"><summary><span>${ICON.anleitungen}Anleitung</span><i>›</i></summary>
    ${ins.ingredients.length?`<h3 class="ph3">Zutaten laut Anleitung</h3><div class="ing">${ins.ingredients.map(z=>`<div><span>${esc(z)}</span></div>`).join('')}</div>`:''}

function planEat(){
  const {d,id}=S.pitem,it=findPlan(d,id);if(!it)return;
  const d0=d>today()?today():d,t0=d0===today()&&it.meal===mealByTime(nowHM())?nowHM():PLAN_TIME[it.meal],n=+it.portions||1;
  if(it.type==='recipe'){const r=recipeBy(it.name);if(!r){toast('Rezept nicht gefunden.',true);return;}commit('addEntries',[recipeEntryRows(r,n,d0,t0,it.meal)]);}
  else if(it.type==='tpl'){const t=tplBy(it.name);if(!t){toast('Vorlage nicht gefunden.',true);return;}commit('addEntries',[t.rows.map(r=>{const x=scaleRow16(r,n);x[0]=d0;x[1]=t0;x[2]=it.meal;return x;})]);}
  else if(geminiPrimary()&&typeof kiRegelt==='function'){S.add={meal:it.meal,date:d0,time:t0};const p0=clonePlan(),x0=(p0[d]||[]).find(y=>y.id===id);if(x0)x0.done=true;savePlan(p0);kiRegelt(it.name);return;}
  else commit('addInbox',[{date:d0,meal:it.meal,time:t0,what:it.name,amount:''}]);
  const p=clonePlan();const x=(p[d]||[]).find(y=>y.id===id);if(x)x.done=true;savePlan(p);
  closeSheet();vibe();toast(it.type==='text'?'Wartet auf KI: '+it.name:'Eingetragen: '+it.name);
}

/* --- Einkaufsliste --- */
/* v35: Einkauf in Gesamtportionen. it.cook = eigene Zahl fürs Einkaufen (Spalte „Einkauf (Portionen)“), sonst
   deine Portionen + „Für andere mit einkaufen“ (Einstellung shopExtra). Zählt NIE als gegessen. */
const shopExtra=()=>+((S.data.settings||{}).shopExtra)||0;
const cookOf=it=>it.cook!==null&&it.cook!==undefined&&it.cook!==''?+it.cook:(+it.portions||1)+shopExtra();
function shopRecipes(mon){const out=[];for(let i=0;i<7;i++){const d=addDays(mon,i);if(d<today())continue;planOf(d).forEach(it=>{if(!it.done&&it.type==='recipe'&&recipeBy(it.name))out.push({d,it});});}return out;}
function shopOverHtml(){
  const mon=S.pweek,rs=shopRecipes(mon),ex=shopExtra();
  return `<h2>Einkaufen · KW ${isoWeek(mon)}</h2><p class="sub">Ab heute: für wie viele Portionen du einkaufst. Das zählt nicht als gegessen.</p>
    <div class="shx"><div><b>Für andere mit einkaufen</b><small>pro Rezept zusätzlich zu deinen Portionen</small></div><div class="stepper sm"><button data-act="shopExtra" data-dd="-0.5" aria-label="weniger">−</button><b class="num">+${fmtN(ex)}</b><button data-act="shopExtra" data-dd="0.5" aria-label="mehr">+</button></div></div>
    ${rs.length?`<div class="shpo-l">${rs.map(({d,it})=>{const own=it.cook!==null&&it.cook!==undefined&&it.cook!=='';return `<div class="shpo"><div class="shpo-m"><b>${esc(it.name)}</b><small>${DS[wd(d)]} ${shortDate(d)} · ${MEAL_SHORT[it.meal]} · du isst ${fmtN(+it.portions||1)}${own?` · <button class="linkbtn" data-act="shopCookStd" data-d="${d}" data-id="${it.id}">Standard</button>`:''}</small></div>
      <div class="stepper sm"><button data-act="shopCook" data-d="${d}" data-id="${it.id}" data-dd="-0.5" aria-label="weniger">−</button><b class="num ${own?'own':''}">${fmtN(cookOf(it))}</b><button data-act="shopCook" data-d="${d}" data-id="${it.id}" data-dd="0.5" aria-label="mehr">+</button></div></div>`;}).join('')}</div>
      <button class="btn" data-act="shopList" style="margin-top:14px">Zur Einkaufsliste</button>`:'<div class="empty">Für diese Woche sind noch keine Rezepte geplant, die noch nicht gegessen sind.</div>'}`;
}
function shopItems(mon){
  const agg=new Map();
  for(let i=0;i<7;i++){if(addDays(mon,i)<today())continue;planOf(addDays(mon,i)).forEach(it=>{
    if(it.done||it.type!=='recipe')return;const r=recipeBy(it.name);if(!r)return;const f=cookOf(it)/(r.portions||1);
    r.items.forEach(x=>{
      const a=String(x.amount||'').trim(),m=a.match(/^(?:ca\.\s*)?(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|Stück|Stk\.?|EL|TL|Dose|Dosen|Bund|Prise)?\b/i);
      const key=norm(x.name);let e=agg.get(key);if(!e){e={name:x.name,units:{},raw:[],from:new Set()};agg.set(key,e);}
      e.from.add(r.name);
      if(m){let n=parseFloat(m[1].replace(',','.'))*f,u=(m[2]||'Stück').replace(/^Stk\.?$/i,'Stück');if(/^kg$/i.test(u)){n*=1000;u='g';}if(/^l$/i.test(u)){n*=1000;u='ml';}e.units[u]=(e.units[u]||0)+n;}
      else if(a)e.raw.push(a);
    });
  });}
  const fmt=(n,u)=>u==='g'&&n>=1000?fmtN(Math.round(n/100)/10)+' kg':u==='ml'&&n>=1000?fmtN(Math.round(n/100)/10)+' l':(u==='g'||u==='ml'?Math.round(n/5)*5||Math.round(n):/^(Stück|Dose|Dosen|Bund)$/i.test(u)?Math.ceil(n-0.05):Math.round(n*10)/10).toString().replace('.',',')+' '+u;
  return [...agg.values()].map(e=>({key:norm(e.name),name:e.name,amount:Object.entries(e.units).map(([u,n])=>fmt(n,u)).concat(e.raw).join(' + '),from:[...e.from]})).sort((a,b)=>a.name.localeCompare(b.name,'de'));
}
const shopKey=mon=>'et-shop-'+mon;
function openShop(){

    ${list.length?`${shopGroups(open).map(([c,xs])=>`<div class="res-h">${c}</div><div class="shopl">${xs.map(row).join('')}</div>`).join('')}${done.length?`<div class="res-h">Schon da (${done.length})</div><div class="shopl">${done.map(row).join('')}</div>`:''}
    <div class="pacts" style="margin-top:16px"><button class="btn" data-act="shopShare">Als Liste teilen</button><button class="btn ghost" data-act="shopImg">Als Bild teilen</button></div>
    <div class="pacts" style="margin-top:2px"><button class="linkbtn" data-act="shopCopy">Liste kopieren</button>${done.length?'<button class="linkbtn" data-act="shopReset">Haken entfernen</button>':''}</div>
    <p class="hint">Teilen öffnet das Menü deines Geräts, z. B. für WhatsApp. Geteilt wird nur, was noch nicht abgehakt ist.</p>`:'<div class="empty">Für diese Woche sind noch keine Rezepte geplant.</div>'}`);

function recipeCards(){
  const rs=recipeList();
  if(!rs.length)return '<div class="card faint">Kein Rezept gefunden.'+(rfCount()||S.recQ?' <button class="linkbtn" data-act="recClearAll">Suche und Filter löschen</button>':'')+'</div>';

/* Menge -> Gramm: "150 g", "0,5 kg", "1 Pack", "2 Stück" (wenn das Lebensmittel ein Portions-/Packungsgewicht hat) */
function amountGrams(txt,base){
  const t=String(txt||'').trim(),num=s=>parseFloat(String(s).replace(',','.'));
  let m=t.match(/(\d+(?:[.,]\d+)?)\s*(kg|l)\b/i);if(m)return num(m[1])*1000;
  m=t.match(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/i);if(m)return num(m[1]);
  m=t.match(/^(?:ca\.\s*)?(\d+(?:[.,]\d+)?)\s*([a-zäöüß]+)?/i);if(!m||!base||!base.unit)return null;
  const u=norm(m[2]||''),un=norm(base.uname||'');
  if(!u||/^(stuck|stk|pack|packung|packungen|portion|portionen|dose|becher|riegel|scheibe|scheiben|beutel|glas)$/.test(u)||(un&&(un.startsWith(u)||u.startsWith(un.slice(0,4)))))return num(m[1])*base.unit;
  return null;
}
function reCalc(x){
  if(!x.base)return;const g=amountGrams(x.amount,x.base);
  if(g===null||isNaN(g)){x.open=true;['kcal','p','c','f'].forEach(f=>x[f]='');return;}
  const b=x.base;x.open=false;
  x.kcal=Math.round(b.k*g/100);x.p=r1(b.p*g/100);x.c=r1(b.c*g/100);x.f=r1(b.f*g/100);
}

/* Tastatur */
document.addEventListener('keydown',e=>{
  if(!S.data||e.ctrlKey||e.metaKey||e.altKey)return;
  const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
  if(e.key==='Escape'){if(typing){e.target.blur();return;}if(S.sheetOpen){closeSheet();e.preventDefault();}else if(S.selMode)endSel();return;}
  if(typing||S.sheetOpen||document.getElementById('intro'))return;
  const dir=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;
  if(dir){
    const t=today();let ok=true;
    if(S.view==='heute'){const n=addDays(S.day,dir);if(n<=t)S.day=n;else ok=false;}
    else if(S.view==='woche'){const n=addDays(S.week,dir*7);if(n<=t)S.week=n;else ok=false;}
    else if(S.view==='wochenplan')S.pweek=addDays(S.pweek||monday(t),dir*7);
    else if(S.view==='monat'){const [y,m]=S.month.split('-').map(Number),n=iso(new Date(y,m-1+dir,1)).slice(0,7);if(n<=t.slice(0,7))S.month=n;else ok=false;}
    else ok=false;
    if(ok){e.preventDefault();render();}return;
  }
  const key=e.key.toLowerCase();
  if(key==='n'||e.key==='+'){e.preventDefault();openAdd(null);return;}
  if(key==='t'){S.day=today();S.week=monday(today());S.pweek=monday(today());S.month=today().slice(0,7);render();return;}
  if(/^[1-9]$/.test(e.key)){const tb=navTabs()[+e.key-1];if(tb){e.preventDefault();go(tb[0]);}}
});

const CALC_ACT=[[1.2,'Kaum Bewegung','Bürojob, wenig Sport'],[1.375,'Leicht aktiv','1–3× pro Woche Sport oder viel zu Fuß'],[1.55,'Mäßig aktiv','3–5× pro Woche Sport'],[1.725,'Sehr aktiv','6–7× pro Woche Sport'],[1.9,'Extrem aktiv','Körperliche Arbeit und viel Sport']];

/* ================= Wischen auf Einträgen (v24) =================
   Nach links: „Löschen?“ erscheint, Tippen löscht (mit Rückgängig).
   Nach rechts: „Nochmal essen“ erscheint, Tippen trägt denselben Eintrag für jetzt ein.
   Wischen auf einem Eintrag wechselt nie die Seite; erst ab 12 px waagerecht wird es als Wischen erkannt. */
(function(){
  let st=null,suppress=0;
  const W_DEL=104,W_AGAIN=150;
  function close(row){if(!row)return;const it=row.querySelector(':scope>.item,:scope>.pitem,:scope>.trh,:scope>.trx-h');if(it){it.style.transition='transform .2s';it.style.transform='';}row.classList.remove('open-l','open-r','swiping');delete row.dataset.open;}
  function closeAll(except){document.querySelectorAll('.swr[data-open]').forEach(r=>{if(r!==except)close(r);});}
  document.addEventListener('touchstart',e=>{
    const it=e.target.closest('.swr>.item,.swr>.pitem,.swr>.trh,.swr>.trx-h');
    if(!it||S.selMode||(S.tr&&S.tr.sel)||S.sheetOpen||e.target.closest('.drag-h,input,select,textarea,.trdone,.trok')){if(!e.target.closest('.swa'))closeAll();st=null;return;}
    const row=it.parentNode;closeAll(row);
    st={row,it,x:e.touches[0].clientX,y:e.touches[0].clientY,lock:null,dx:0,base:row.dataset.open==='r'?-W_DEL:row.dataset.open==='l'?W_AGAIN:0};
    it.style.transition='none';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!st)return;const dx=e.touches[0].clientX-st.x,dy=e.touches[0].clientY-st.y;
    if(!st.lock){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3)st.lock='h';else if(Math.abs(dy)>12){st.lock='v';return;}else return;}
    if(st.lock!=='h')return;
    e.preventDefault();
    const hasL=!!st.row.querySelector(':scope>.swa-l'),x=Math.max(-W_DEL-30,Math.min(hasL?W_AGAIN+30:0,st.base+dx));st.dx=x;
    st.row.classList.add('swiping');st.row.classList.toggle('open-r',x<0);st.row.classList.toggle('open-l',x>0);
    st.it.style.transform=`translateX(${x}px)`;
  },{passive:false});
  document.addEventListener('touchend',()=>{
    if(!st)return;const s=st;st=null;
    if(s.lock!=='h'){s.it.style.transition='';return;}
    suppress=Date.now();s.it.style.transition='transform .2s';s.row.classList.remove('swiping');
    if(s.dx<-60){s.it.style.transform=`translateX(${-W_DEL}px)`;s.row.dataset.open='r';s.row.classList.add('open-r');s.row.classList.remove('open-l');vibe(8);}
    else if(s.dx>60){s.it.style.transform=`translateX(${W_AGAIN}px)`;s.row.dataset.open='l';s.row.classList.add('open-l');s.row.classList.remove('open-r');vibe(8);}
    else close(s.row);
  },{passive:true});
  /* Tipp direkt nach dem Wischen oder auf einen offenen Eintrag: nur zurückschieben */
  document.addEventListener('click',ev=>{
    const it=ev.target.closest('.swr>.item,.swr>.pitem,.swr>.trh,.swr>.trx-h');if(!it)return;
    if(Date.now()-suppress<400||it.parentNode.dataset.open){ev.stopPropagation();ev.preventDefault();close(it.parentNode);}
  },true);
  document.addEventListener('click',ev=>{
    const pl=ev.target.closest('[data-act=swPlanDel],[data-act=swPlanEat]');
    if(pl){const d=pl.dataset.d,id=pl.dataset.id;
      if(pl.dataset.act==='swPlanEat'){S.pitem={d,id};planEat();return;}
      const before=clonePlan(),p=clonePlan(),gone=(p[d]||[]).find(x=>x.id===id);p[d]=(p[d]||[]).filter(x=>x.id!==id);savePlan(p);vibe(15);
      toast('Entfernt: '+(gone?gone.name:''),false,{label:'Rückgängig',fn:()=>savePlan(before)});return;}
    const el=ev.target.closest('[data-act=swDel],[data-act=swAgain]');if(!el)return;
    const x=S.items[el.dataset.id];if(!x)return;
    if(el.dataset.act==='swDel'){delWithUndo([x]);return;}
    const rows=itemsOf(x),t=nowHM(),m=mealByTime(t);
    commit('repeatRows',[rows.map(e=>e.row),today(),t,m,1]);vibe(15);
    toast('Nochmal eingetragen: '+(x.single?x.single.name:x.recipe)+' ('+MEAL_SHORT[m]+', '+t+')');
  });
})();

function aiCands(text){
  if(!S.foods)return [];
  const parts=String(text||'').split(/,|;|\n|\+|\bund\b|\bmit\b|\bdazu\b/i).map(x=>x.trim()).filter(x=>x.length>1);
  const seen=new Set(),out=[];
  for(const p of parts.slice(0,12))for(const f of searchFoods(p).slice(0,5)){const kk=f[0]+'|'+f[1];if(seen.has(kk))continue;seen.add(kk);out.push(f);}
  return out.slice(0,50).map(f=>[f[0],f[1],f[2],f[3],f[4],f[5],f[6],f[7],f[8],f[9],f[11],f[12],f[13],f[14]]);

function aiRecs(text){
  const rs=(S.data.recipes||[]).filter(r=>r.items&&r.items.length);if(!rs.length)return [];
  const w=norm(String(text||'')).split(/[^a-z0-9äöüß]+/).filter(x=>x.length>2);
  let pick=w.length?rs.filter(r=>{const n=norm(r.name);return w.some(x=>n.includes(x)||n.includes(stem(x)));}):[];
  if(!w.length||(S.add&&S.add.aiImg))pick=pick.concat(rs.filter(r=>!pick.includes(r)));   // Foto: alle Rezepte zur Auswahl

}

/* ---------- Pausen-Timer ---------- */
function trTimerStart(){
  const sec=trOpt().timerSec||90;let el=$('#trtimer');if(!el){el=document.createElement('button');el.id='trtimer';el.className='trtimer';document.body.appendChild(el);el.onclick=()=>{clearInterval(el._i);el.remove();};}
  const end=Date.now()+sec*1000;clearInterval(el._i);
  const tick=()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));el.innerHTML=`⏱ <b class="num">${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}</b><small>tippen zum Beenden</small>`;
    if(r<=0){clearInterval(el._i);vibe([200,100,200]);el.classList.add('done');el.innerHTML='⏱ <b>Weiter geht’s!</b>';setTimeout(()=>el.remove(),4000);}};
  tick();el._i=setInterval(tick,500);
}
/* ---------- Sortieren per Griff (Maus und Finger) ---------- */
(function(){
  let D=null;
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.drag-h');if(!h)return;e.preventDefault();
    const list=h.closest('[data-list]'),item=h.closest(list.dataset.list==='plans'?'.trp':'.trx');if(!list||!item)return;
    const items=[...list.children];D={list,item,items,from:items.indexOf(item),y0:e.clientY,key:h.dataset.list,id:e.pointerId,to:items.indexOf(item)};
    item.classList.add('dragging');try{h.setPointerCapture(e.pointerId);}catch(_){}
  });
  document.addEventListener('pointermove',e=>{
    if(!D||e.pointerId!==D.id)return;const dy=e.clientY-D.y0;D.item.style.transform=`translateY(${dy}px)`;
    const mid=D.item.getBoundingClientRect().top+D.item.offsetHeight/2;let to=0;
    D.items.forEach((x,i)=>{if(x===D.item)return;const r=x.getBoundingClientRect();if(mid>r.top+r.height/2)to=i+(i<D.from?1:0);});
    if(dy<0)to=Math.min(to,D.from);D.to=Math.max(0,Math.min(D.items.length-1,to));
    D.items.forEach((x,i)=>x.classList.toggle('drop-b',x!==D.item&&i===D.to&&D.to!==D.from));
  });
  const end=()=>{if(!D)return;const d=D;D=null;d.item.style.transform='';d.item.classList.remove('dragging');d.items.forEach(x=>x.classList.remove('drop-b'));
    if(d.to===d.from)return;const plans=TRD().plans;
    if(d.key==='plans'){const [x]=plans.splice(d.from,1);plans.splice(d.to,0,x);}
    else{const pi=+d.key.split(':')[1],arr=plans[pi].items;const x=trRemove(arr,d.from);arr.splice(d.to,0,x);TRS().ex=null;}
    vibe(10);trSavePlans();render();};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();

(function(){
  let t=null,sx=0,sy=0,fired=0;
  const at=e=>{const h=e.target.closest('.trx-h');if(!h||e.target.closest('.drag-h,.trok,.swa,input,textarea'))return null;const tx=h.closest('.trx'),tp=h.closest('.trp');return tx&&tp?{pi:+tp.dataset.pi,xi:+tx.dataset.xi}:null;};
  const fire=w=>{fired=Date.now();const s=TRS().sel;if(s&&s.pi===w.pi)trSelToggle(w.xi);else trSelStart(w.pi,w.xi);};
  document.addEventListener('touchstart',e=>{const w=at(e);clearTimeout(t);t=null;if(!w||S.sheetOpen)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    t=setTimeout(()=>{t=null;const r=e.target.closest('.swr');if(r&&r.dataset.open)return;fire(w);},480);},{passive:true});
  document.addEventListener('touchmove',e=>{if(t&&(Math.abs(e.touches[0].clientX-sx)>8||Math.abs(e.touches[0].clientY-sy)>8)){clearTimeout(t);t=null;}},{passive:true});
  document.addEventListener('touchend',()=>{if(t){clearTimeout(t);t=null;}},{passive:true});
  document.addEventListener('contextmenu',e=>{const w=at(e);if(!w)return;e.preventDefault();if(Date.now()-(window.lastTouch||0)<1500&&Date.now()-fired<1500)return;fire(w);});
  document.addEventListener('click',e=>{if(fired&&Date.now()-fired<600&&e.target.closest('.trx-h')){fired=0;e.stopPropagation();e.preventDefault();}},true);
})();

/* ================= v43: Extras =================
   Serie (Tage am Stück im kcal-Ziel), Wochenrückblick beim ersten Start der Woche, Jahresübersicht (Heatmap),
   Gewichts-Meilensteine. Alles in Einstellungen → Extras schaltbar.

const fun=()=>{const s=(S.data&&S.data.settings)||{};return {streak:s.streak!==false,weekReview:s.weekReview!==false,heatmap:s.heatmap!==false,mile:Object.assign({on:false,step:1},s.mile||{})};};
const inGoal=s=>{const d=S.by[s];return !!(d&&d.n&&d.kcal<=goalOn(s).kcalDay);};

/* ---------- Serie ---------- */
/* Tage am Stück im kcal-Ziel bis gestern (heute läuft noch); zählt heute mit, sobald heute schon im Ziel ist und gestern auch */
function streakTo(day){let n=0,s=addDays(day,-1);while(inGoal(s)&&n<400){n++;s=addDays(s,-1);}return n;}
/* Tage am Stück mit Einträgen bis einschließlich 'day' (ist 'day' noch leer, zählt ab dem Vortag) */
const hasDay=s=>!!(S.by[s]&&S.by[s].n);

/* ---------- Jahresübersicht ---------- */
function heatHtml(){

  let cells='',months='',lastM=-1,lastC=-9,nDays=0,nGoal=0;const all=[];

    if(m!==lastM){const room=c===0?pm.getDate()<=10:true;if(room&&c-lastC>=3&&c<cols-2){months+=`<text x="${L+c*st}" y="10" font-size="9.5" fill="var(--faint)">${MONTHS[m].slice(0,3)}</text>`;lastC=c;}lastM=m;}

function wrData(mon){
  const days=[0,1,2,3,4,5,6].map(i=>addDays(mon,i)),used=days.filter(s=>S.by[s]&&S.by[s].n);
  const sum=f=>used.reduce((a,s)=>a+S.by[s][f],0),gw=goalWk(mon).kcalWeek;
  const prevMon=addDays(mon,-7),prev=[0,1,2,3,4,5,6].map(i=>addDays(prevMon,i)).filter(s=>S.by[s]&&S.by[s].n);
  const ws=(typeof weights==='function'?weights():[]).filter(w=>w.date>=addDays(mon,-3)&&w.date<=addDays(mon,6));
  const wIn=ws.filter(w=>w.date>=mon),wBefore=ws.filter(w=>w.date<mon);
  const w0=wBefore.length?wBefore[wBefore.length-1].kg:(wIn.length?wIn[0].kg:null),w1=wIn.length?wIn[wIn.length-1].kg:null;

    inK:used.filter(inGoal).length,inP:used.filter(s=>S.by[s].p>=goalOn(s).proteinDay).length,
    avgK:used.length?sum('kcal')/used.length:0,avgP:used.length?sum('p')/used.length:0,
    prevAvgK:prev.length?prev.reduce((a,s)=>a+S.by[s].kcal,0)/prev.length:null,
    w0,w1,trained:mods().training&&typeof trDays==='function'?days.filter(s=>trDays().has(s)).length:null};
}
function wrRing(v,goal){

function wrHead(x){

/* Beim ersten Start einer neuen Woche (meist Montag): kleines Fenster mit Ja / Nein / Nicht mehr anzeigen */
function wrAuto(){

  if(DEMO&&!window.WR_TEST)return;
  const mon=monday(today()),last=addDays(mon,-7);let seen=null;try{seen=localStorage.getItem('et-wr');}catch(e){}
  if(seen===mon||S.data.settings.wrSeen===mon){S.wrDone=true;return;}

/* Rezepte der Woche: wie oft gegessen, Sterne direkt antippbar */
function wrRecipes(mon){
  const m={};
  for(let i=0;i<7;i++){const s=addDays(mon,i),d=S.by[s];if(!d)continue;
    MEALS.forEach(ml=>{const seen=new Set();(d.meals[ml]?d.meals[ml].items:[]).forEach(e=>{if(!e.recipe)return;const key=e.recipe+'|'+(e.time||'');if(seen.has(key))return;seen.add(key);(m[e.recipe]=m[e.recipe]||{n:0,days:new Set()}).n++;m[e.recipe].days.add(s);});});}
  return Object.entries(m).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0]));
}
function wrRecHtml(mon){
  const rs=wrRecipes(mon);if(!rs.length)return '';

  return `<h3 class="wr-h">Diese Rezepte hast du gegessen</h3>${open?`<p class="wr-hint">${open===1?'Eins ist':open+' sind'} noch nicht bewertet. Einfach die Sterne antippen.</p>`:''}
    <div class="wr-recs">${rs.map(([n,x])=>{const r=recipeBy(n),v=r?rRating(n):0;
      return `<div class="wr-rec ${r&&!v?'new':''}">${pThumb(n)||`<span class="pthumb wr-noimg" style="--ph:${recColor(n)}">${ICON.rezepte}</span>`}<div class="wr-rn"><b>${esc(n)}</b><small>${x.n}× gegessen${x.days.size>1?' an '+x.days.size+' Tagen':''}${r&&!v?' · noch nicht bewertet':''}</small></div>${r?starsHtml(n,v,{act:'wrRate'}):''}</div>`;}).join('')}</div>`;
}
/* Beschwerden der Woche + Vermutung: was vor Beschwerden auffällig oft gegessen wurde (über alle Daten) */
function wrSuspects(cs){
  const comp=new Set((S.data.complaints||[]).map(c=>c.date)),eat={};
  (S.data.diary||[]).forEach(r=>{const n=r[10]||r[4];if(!n||!r[1])return;(eat[n]=eat[n]||new Set()).add(r[1]);});
  const cand=new Set();cs.forEach(c=>{namesOn(c.date).concat(namesOn(addDays(c.date,-1))).forEach(n=>cand.add(n));});
  return [...cand].map(n=>{const ds=[...(eat[n]||[])],hit=ds.filter(d=>comp.has(d)||comp.has(addDays(d,1))).length;return {n,eaten:ds.length,hit,q:ds.length?hit/ds.length:0};})
    .filter(x=>x.eaten>=2&&x.hit>=2&&x.q>=0.5).sort((a,b)=>b.q-a.q||b.hit-a.hit).slice(0,3);
}
function wrCompHtml(mon){

/* Teilen: Bild-Karte ohne Körpergewicht, nur die Veränderung */
function wrWeightChange(mon){
  const ws=weights();if(!ws.length)return null;const sun=addDays(mon,6);
  const upto=ws.filter(w=>w.date<=sun);if(!upto.length)return null;const end=upto[upto.length-1];
  const before=ws.filter(w=>w.date<mon),startW=before.length?before[before.length-1]:ws.find(w=>w.date>=mon);
  return {week:startW?end.kg-startW.kg:null,total:end.kg-ws[0].kg,since:ws[0].date};
}
const sgn=v=>Math.abs(v)<0.05?'±0,0 kg':(v<0?'−':'+')+nf1.format(Math.abs(v))+' kg';

  const tiles=[['Tage im kcal-Ziel',x.inK+'/'+(x.used.length||7)],['Eiweiß-Ziel',x.inP+'/'+(x.used.length||7)],['Ø kcal pro Tag',x.used.length?k(x.avgK):'–'],['Ø Eiweiß pro Tag',x.used.length?g1(x.avgP)+' g':'–']];

      else{g.fillStyle='#E0904F';g.fill(new Path2D('M12.6 2.2c.3 2.6-.8 4.3-2.3 5.9C8.7 9.8 7 11.6 7 14.6A5 5 0 0 0 12 20a5 5 0 0 0 5-5.2c0-1.6-.6-2.9-1.4-4 .1 1.3-.4 2.4-1.4 2.9.4-3.6-.6-8.3-1.6-11.5z'));}

/* ---------- Gewichts-Meilensteine ---------- */
function mileLevel(kg,step,dir){return dir==='up'?Math.ceil(kg/step-1e-9)*step-step:Math.floor(kg/step+1e-9)*step+step;}
function mileInit(c){
  const ws=weights(),last=ws.length?ws[ws.length-1].kg:null,goal=+g2().weight||0;
  if(last===null)return Object.assign(c,{on:true,best:null,dir:'down',goalDone:0});
  const dir=goal>last?'up':'down';
  return Object.assign(c,{on:true,dir,best:mileLevel(last,c.step||1,dir),goalDone:goal&&(dir==='down'?last<=goal:last>=goal)?goal:0});
}
function mileCheck(){
  const c=fun().mile;if(!c.on||S.mileBusy)return;
  const ws=weights();if(!ws.length)return;const w=ws[ws.length-1];
  if(w.date<addDays(today(),-7))return;                 /* alte Werte feiern wir nicht */
  const step=c.step||1,dir=c.dir||'down',goal=+g2().weight||0,lv=mileLevel(w.kg,step,dir);
  if(c.best===null||c.best===undefined){saveMile(Object.assign({},c,{best:lv}));return;}
  const goalHit=goal&&c.goalDone!==goal&&(dir==='down'?w.kg<=goal:w.kg>=goal);
  const newLv=dir==='down'?lv<c.best:lv>c.best;
  if(!goalHit&&!newLv)return;
  S.mileBusy=true;
  const n=Object.assign({},c,{best:newLv?lv:c.best,goalDone:goalHit?goal:c.goalDone});
  saveMile(n);
  setTimeout(()=>{S.mileBusy=false;mileParty(goalHit?'Zielgewicht erreicht!':(dir==='down'?'Unter '+lv+' kg!':'Über '+lv+' kg!'),goalHit?nf1.format(w.kg)+' kg · Ziel '+nf1.format(goal)+' kg':'Neuer Meilenstein · '+nf1.format(w.kg)+' kg',goalHit);},400);
}
function saveMile(c){const s=JSON.parse(JSON.stringify(S.data.settings));s.mile=c;commit('saveSettings',[s]);}
function mileParty(title,sub,big){
  const old=$('#mile');if(old)old.remove();
  const el=document.createElement('div');el.id='mile';el.className='mile'+(big?' big':'');el.setAttribute('role','status');
  el.innerHTML=`<div class="mile-c"><div class="mile-i">${big?'🏁':'⭐'}</div><b>${esc(title)}</b><span>${esc(sub)}</span></div>`;
  document.body.appendChild(el);vibe([20,40,20]);
  requestAnimationFrame(()=>el.classList.add('on'));
  const card=el.querySelector('.mile-c'),anim=S.data.settings.anim!==false&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(anim){const cols=['var(--brand)','var(--prot)','var(--m1)','var(--m4)','var(--m3)'];
    for(let i=0;i<(big?44:28);i++){const d=document.createElement('i');d.className='cf';d.style.left='50%';d.style.top='38%';d.style.background=cols[i%5];
      const a=Math.random()*Math.PI*2,r=70+Math.random()*(big?160:110);d.style.setProperty('--x',Math.cos(a)*r+'px');d.style.setProperty('--y',Math.sin(a)*r-40+'px');d.style.setProperty('--rot',Math.random()*540+'deg');
      card.appendChild(d);setTimeout(()=>d.remove(),1300);}}
  const close=()=>{el.classList.remove('on');setTimeout(()=>el.remove(),300);};
  el.addEventListener('click',close);setTimeout(close,big?4200:3200);
}

    if(dy<=0||sh.scrollTop>0){if(d.dy>0){sh.style.transform='';}d=dy<=0&&d.dy===0?null:d;if(d)d.dy=0;return;}
    d.dy=dy;sh.style.transition='none';sh.style.transform='translateY('+dy+'px)';e.preventDefault();
  },{passive:false});

function nutHtml(fd,g){const x=i=>fd[i]*g/100;return `<div><small>kcal</small><b class="num">${k(x(2))}</b></div><div><small>Eiweiß</small><b class="num">${g1(x(3))}</b></div><div><small>KH</small><b class="num">${g1(x(4))}</b></div><div><small>Fett</small><b class="num">${g1(x(6))}</b></div>`;}
function miniNut(kc,p,f){return `<div style="grid-column:span 2"><small>kcal</small><b class="num">${k(kc*f)}</b></div><div style="grid-column:span 2"><small>Eiweiß</small><b class="num">${g1(p*f)} g</b></div>`;}
/* v35: Basis für freie Mengen bei „Zuletzt gegessen“: Gramm/ml aus der Menge, bei Rezepten die Portionen */
function recentBase(x){const a=String(x.amount||'');
  if(!x.recipe){const gm=a.match(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/);if(gm&&parseFloat(gm[1].replace(',','.'))>0)return {base:parseFloat(gm[1].replace(',','.')),unit:gm[2]};return null;}
  const pm=a.match(/^(\d+(?:[.,]\d+)?) von (\d+(?:[.,]\d+)?)/);if(pm&&parseFloat(pm[1].replace(',','.'))>0)return {base:parseFloat(pm[1].replace(',','.')),unit:'Port.',of:pm[2]};return null;}
function factorHtml(cur){return `<label class="f"><span>Menge</span></label><div class="facts">${[0.5,1,1.5,2,3].map(f=>`<button class="${f===cur?'on':''}" data-act="factor" data-f="${f}">${f===0.5?'½':f===1.5?'1½':f}×</button>`).join('')}</div>`;}
function resultsHtml(){
  const q=S.add.q.trim();
  const qw=norm(q).split(/[^a-z0-9]+/).filter(w=>w&&!/^(s|m|l|xl)$/.test(w));
  let rec=recentList().filter(x=>{if(!qw.length)return true;const ws=norm((x.recipe||x.name)+' '+x.amount).split(/[^a-z0-9]+/);return qw.every(w=>ws.some(v=>v.startsWith(w)));});
  if(!q&&S.add.mealOnly)rec=recentList().filter(x=>x.meal===S.add.mealOnly).slice(0,S.data.settings.recentN||20);
  if(q){const by=new Map();for(const x of rec){const kk=norm(x.recipe||x.name),o=by.get(kk);if(!o)by.set(kk,Object.assign({},x,{total:x.count}));else o.total+=x.count;}
    rec=[...by.values()].sort((a,b)=>b.total-a.total||(b.last+b.time).localeCompare(a.last+a.time));}
  rec=rec.slice(0,q?8:(S.data.settings.recentN||20));
  S.add.recList=rec;
  let h='';
  h+=tplChips(q)+(q?recipeChips(q):'');
  /* v41: angezeigte Reihenfolge = gemerkte Liste (vorher griff der Tipp in die unsortierte Liste → falscher Eintrag); „… zuerst“ antippen wechselt die Mahlzeit */
  if(!q&&mods().haeufig&&!S.add.mealOnly){const mm=S.add.fqMeal||S.add.meal,fq=frequent().slice().sort((a,b)=>(b.meal===mm)-(a.meal===mm));S.add.freqList=fq;if(fq.length)h+=`<div class="res-h">Häufig · <button class="fqm" data-act="fqMeal">${MEAL_SHORT[mm]} zuerst <i>⇄</i></button></div><div class="fchips">${fq.map((x,i)=>`<button class="fchip" data-act="pickFreq" data-i="${i}" style="--mc:${MEAL_COLOR[x.meal]||'var(--m4)'}"><i></i><span>${esc(x.recipe||x.name)}</span><small class="num">${k(x.kcal)}</small></button>`).join('')}</div>`;}
  if(rec.length||S.add.mealOnly)h+=`<div class="res-h">${q?'Schon gegessen':S.add.mealOnly?'Zuletzt zum '+MEAL_SHORT[S.add.mealOnly]+' <button class="linkbtn" data-act="mealOnlyOff" style="float:right;margin:0">alle zeigen</button>':'Zuletzt gegessen'}</div>`+(S.add.mealOnly&&!rec.length?'<div class="empty">Dazu gibt es noch nichts.</div>':'')+`<div class="res">${rec.map((x,i)=>`<button class="item" data-act="pickRecent" data-i="${i}"><div class="it-main"><div class="it-name">${x.recipe?'<span class="tag">Rezept</span>'+esc(x.recipe):esc(x.name)}</div><div class="it-sub">${esc(x.amount)} · ${relDay(x.last)||shortDate(x.last)}</div></div><div class="it-val"><b class="num">${k(x.kcal)}</b><small class="num">${g1(x.p)} g E</small></div></button>`).join('')}</div>`;
  if(q){
    if(!S.foods)h+=`<div class="res-h">Lebensmittel</div><div class="empty" style="padding:10px 2px">Lade Lebensmittel-Datenbank …</div>`;
    else{
      const fs=searchFoods(q);S.add.foodList=fs;
      h+=`<div class="res-h">Lebensmittel (pro 100 g)</div>`+(fs.length?`<div class="res">${fs.map((f,i)=>`<button class="item" data-act="pickFood" data-i="${i}"><div class="it-main"><div class="it-name">${esc(f[0])}</div><div class="it-sub">${f[1]?esc(f[1])+' · ':''}${g1(f[3])} g E · ${g1(f[4])} g KH · ${g1(f[6])} g F</div></div><div class="it-val"><b class="num">${k(f[2])}</b><small class="faint">kcal</small></div></button>`).join('')}</div>`:'<div class="empty" style="padding:10px 2px">Nichts in der Datenbank gefunden.</div>');
    }
    /* v36: Eine KI. Nichts gefunden → „KI regelt“ steht oben (nicht unter der Tastatur), sonst am Ende der Liste */
    const none=!(S.add.foodList||[]).length&&!rec.length,ki=kiOn()?`<button class="aibtn kireg" data-act="kiRegelt">✨<span><b>${none?'Nichts gefunden':'Nichts Passendes?'} → KI regelt</b><small>„${esc(q)}“ · ${geminiPrimary()?'wird gleich im Hintergrund eingetragen':'wartet auf die KI, wird beim nächsten Gespräch eingetragen'}</small></span></button>`:'';
    if(none&&ki)h=ki+h;
    h+=`<div class="fallback"><button data-act="addstep" data-step="manual" class="${kiOn()?'':'wide'}">Selbst eintragen<small>Werte bekannt</small></button>${kiOn()?`<button data-act="addstep" data-step="${geminiPrimary()?'ai':'photo'}">📷 Foto an die KI<small>Teller oder Packung</small></button>`:''}</div>`;
  } else h+=`<p class="hint">Tippe oben, um in deinen ${S.foods?k(S.foods.length)+' ':''}Lebensmitteln zu suchen.</p>`;
  return h;
}

(function start(){
  if(!LIVE&&!DEMO){connectScreen();return;}
  try{if(!localStorage.getItem('et-intro')&&!window.PREVIEW)setTimeout(()=>introStep(0),900);}catch(e){}
  const cached=LIVE?store.get(CACHE):null;
  if(cached&&cached.d){apply(cached.d,true);updateSyncBadge();
    if(Q.q.length)pump();else resync();
    setTimeout(()=>loadFoods().catch(()=>{}),1500);return;}
  call('getData').then(d=>{busy(false);S.lastSync=Date.now();apply(d);if(Q.q.length)pump();setTimeout(()=>loadFoods().catch(()=>{}),1200);})
    .catch(e=>{busy(false);if(cached){S.stale=null;render();toast('Keine Verbindung, zeige gespeicherten Stand.',true);}
      else $('#view').innerHTML=`<div class="card"><b>Konnte das Tagebuch nicht laden.</b><p class="small muted">${esc(e.message||e)}</p></div>`;});
})();

/* Offline-Hilfe registrieren und auf neue Versionen hinweisen */
(function(){
  if(!('serviceWorker' in navigator)||location.protocol!=='https:'||window.PREVIEW||window.DEMO)return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=()=>{
      if(document.getElementById('updbar'))return;
      const b=document.createElement('button');b.id='updbar';b.className='updbar';
      b.innerHTML='<b>Neue Version da</b><span>Tippen zum Laden</span>';
      b.onclick=()=>{if(reg.waiting)reg.waiting.postMessage('skip');else location.reload();};
      document.body.appendChild(b);
    };
    if(reg.waiting&&navigator.serviceWorker.controller)show();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show();});});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  }).catch(()=>{});
})();
