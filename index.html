<style>
:root{
  --bg:#F4F2EC; --card:#FFFFFF; --ink:#1E2320; --muted:#6C726E; --faint:#9AA09C; --line:#E6E2D8; --soft:#EEEBE3;
  --brand:#2E5D50; --brand-2:#3E7766; --brand-soft:#E3EEE8;
  --ok:#2E7D5B; --warn:#C9821A; --bad:#BF3A2B; --bad-soft:#F8E1DD; --prot:#2F6E9A; --prot-soft:#E1ECF4;
  --m1:#E3A33A; --m2:#4A8CC4; --m3:#8A68C4; --m4:#D9736F;
  --r:18px; --shadow:0 1px 2px rgba(30,35,32,.05),0 6px 20px rgba(30,35,32,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --on-brand:#FFFFFF; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --font-head:var(--font); --head-w:750;
}
@media (prefers-color-scheme:dark){ :root[data-theme=auto]{ --bg:#141816; --card:#1D2220; --ink:#ECEFEC; --muted:#A3AAA6; --faint:#79807C; --line:#2C3330; --soft:#252B28; --brand:#7CC2A8; --brand-2:#93D1B9; --brand-soft:#21332C; --on-brand:#0F1A16; --bad:#F07A6A; --bad-soft:#3A2522; --prot:#7DB6E0; --prot-soft:#1F2E3A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme=dunkel]{ --bg:#141816; --card:#1D2220; --ink:#ECEFEC; --muted:#A3AAA6; --faint:#79807C; --line:#2C3330; --soft:#252B28; --brand:#7CC2A8; --brand-2:#93D1B9; --brand-soft:#21332C; --on-brand:#0F1A16; --bad:#F07A6A; --bad-soft:#3A2522; --prot:#7DB6E0; --prot-soft:#1F2E3A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark; }
:root[data-theme=ozean]{ --bg:#EAF4F6; --card:#FFFFFF; --ink:#0E2A36; --muted:#557482; --faint:#8AA5B0; --line:#D3E6EB; --soft:#DDEEF2; --brand:#0B7A8C; --brand-2:#1497AA; --brand-soft:#D3EEF2; --on-brand:#FFFFFF; --bad:#D94F3D; --bad-soft:#FBE3DF; --prot:#3557C9; --prot-soft:#E1E7FA; --m1:#F2A93B; --m2:#1497AA; --m3:#6B6FD6; --m4:#EF7C6A; --r:20px; --shadow:0 1px 2px rgba(14,42,54,.05),0 8px 24px rgba(14,42,54,.08); --font:'Outfit',system-ui,sans-serif; --font-head:'Outfit',system-ui,sans-serif; --head-w:650; }
:root[data-theme=lovely]{ --bg:#FFF0F4; --card:#FFFFFF; --ink:#3B2330; --muted:#8C6979; --faint:#BA99A8; --line:#F5D8E1; --soft:#FCE5EC; --brand:#D6457A; --brand-2:#E86C98; --brand-soft:#FBE0EA; --on-brand:#FFFFFF; --bad:#C2334F; --bad-soft:#FBDDE2; --prot:#8A5CC2; --prot-soft:#EEE3FA; --m1:#F4A261; --m2:#7AA7E0; --m3:#B57BD8; --m4:#EE7EA4; --r:24px; --shadow:0 2px 4px rgba(214,69,122,.06),0 10px 26px rgba(214,69,122,.10); --font:'Nunito',system-ui,sans-serif; --font-head:'Nunito',system-ui,sans-serif; --head-w:800; }
:root[data-theme=funny]{ --bg:#FFF5D1; --card:#FFFFFF; --ink:#1B1B3A; --muted:#5E5B7A; --faint:#9A97B3; --line:#EFE0A8; --soft:#FFEFB5; --brand:#5B3DF5; --brand-2:#7A61FF; --brand-soft:#E8E3FF; --on-brand:#FFFFFF; --bad:#FF3D63; --bad-soft:#FFE0E6; --prot:#00A3A3; --prot-soft:#D6F5F2; --m1:#FFB000; --m2:#00AEEF; --m3:#B14CFF; --m4:#FF5C8A; --r:22px; --shadow:3px 3px 0 #1B1B3A; --font:'Fredoka',system-ui,sans-serif; --font-head:'Fredoka',system-ui,sans-serif; --head-w:650; }
:root[data-theme=funny] .card,:root[data-theme=funny] .qc,:root[data-theme=funny] .arrow,:root[data-theme=funny] .search{border:2px solid #1B1B3A}
:root[data-theme=funny] .fab,:root[data-theme=funny] .cbtn{border:2px solid #1B1B3A;box-shadow:3px 3px 0 #1B1B3A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font)}
.top h1,.sheet h2,.ring .c b,.kv b,.nav .lbl b,.meal-h b,.rc .top2 b,.cmp-h b{font-family:var(--font-head);font-weight:var(--head-w)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + var(--safe-b))}

/* Kopf */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top h1.long{font-size:18px}
.top h1{flex:1;min-width:0;margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--soft)}
.iconbtn svg{width:22px;height:22px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:0 14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}

/* Datumsleiste */
.nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.nav .lbl{flex:1;text-align:center;position:relative}
.nav .lbl b{display:block;font-size:17px}
.nav .lbl span{font-size:13px;color:var(--muted)}
.nav .lbl input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.arrow:disabled{opacity:.35}
.arrow svg{width:20px;height:20px}
.todaylink{display:block;margin:-6px auto 10px;font-size:13px;color:var(--brand);font-weight:600}

/* Hero */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-size:30px;font-weight:780;letter-spacing:-.03em;line-height:1}
.ring .c span{font-size:12px;color:var(--muted);margin-top:4px}
.ring.over .c b{color:var(--bad)}
.hstats{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.hrow .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.hrow .t b{color:var(--ink);font-size:14px}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--brand)}
.bar.p i{background:var(--prot)}
.bar.over i{background:var(--bad)}
.chips{display:flex;gap:8px}
.chip{flex:1;background:var(--soft);border-radius:12px;padding:7px 10px}
.chip small{display:block;font-size:11px;color:var(--muted)}
.chip b{font-size:15px}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--brand-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin:0 0 12px}
.banner svg{flex:none;width:20px;height:20px;color:var(--brand);margin-top:1px}
.banner ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}

/* Mahlzeiten */
.meal{padding:0;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 16px}
.meal-h .dot{width:10px;height:10px;border-radius:50%;background:var(--mc)}
.meal-h b{font-size:16px}
.meal-h .sum{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.meal-h .sum strong{color:var(--ink);font-size:15px}
.addmini{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-size:20px;line-height:1}
.items{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--soft)}
.it-main{flex:1;min-width:0}
.it-name{font-weight:550;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it-sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-val{text-align:right;flex:none}
.it-val b{font-size:15px}
.it-val small{display:block;font-size:12px;color:var(--prot)}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:1px 7px;border-radius:20px;background:var(--brand-soft);color:var(--brand);margin-right:6px;vertical-align:1px}
.empty{padding:4px 16px 14px;color:var(--faint);font-size:14px}

/* Woche */
.wk-day{display:grid;grid-template-columns:62px 1fr 74px;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.wk-day:last-child{border-bottom:0}
.wk-day .d b{display:block;font-size:14px}
.wk-day .d span{font-size:12px;color:var(--muted)}
.wk-day.today .d b{color:var(--brand)}
.stack{position:relative;height:14px;border-radius:7px;background:var(--soft);overflow:visible;display:flex}
.stack i{display:block;height:100%}
.stack i:first-child{border-radius:7px 0 0 7px}
.stack i:last-of-type{border-radius:0 7px 7px 0}
.stack .goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
.wk-day .v{text-align:right}
.wk-day .v b{font-size:14px}
.wk-day .v small{display:block;font-size:12px;color:var(--prot)}
.wk-day .v.over b{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--soft);border-radius:14px;padding:10px 12px}
.kv small{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:19px;letter-spacing:-.02em}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}

/* Monat */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.12;border-radius:11px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:13px}
.cal .d.out{background:transparent;color:var(--faint)}
.cal .d.has{background:var(--brand-soft)}
.cal .d.hi{background:var(--bad-soft)}
.cal .d.today{outline:2px solid var(--brand);outline-offset:-2px}
.cal .d b{font-weight:650}
.cal .d small{font-size:10px;color:var(--muted);margin-top:1px}
.cal .d .pd{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--prot)}
.cal .d .cx{position:absolute;top:3px;left:5px;font-size:10px;font-weight:800;color:var(--bad)}

/* Verlauf */
.chart svg{width:100%;height:auto;display:block}
.day-row{width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.day-row:last-child{border-bottom:0}
.day-row .top2{display:flex;align-items:baseline;gap:8px}
.day-row .top2 b{font-size:15px}
.day-row .top2 .k{margin-left:auto;font-weight:700}
.day-row .macros{font-size:12.5px;color:var(--muted);margin:3px 0 7px}
.day-row .stack{height:8px}
.day-row .detail{margin-top:10px}

/* Tagebuch */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0 12px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--faint)}
.search input{flex:1;border:0;outline:0;background:transparent;padding:12px 0}
.dhead{font-size:13px;font-weight:650;color:var(--muted);margin:14px 4px 6px}
.list{padding:0;overflow:hidden}
.pill{font-size:11px;padding:1px 7px;border-radius:20px;color:#fff;background:var(--mc);margin-right:6px;font-weight:600}
.more{display:block;width:100%;padding:12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);color:var(--brand);font-weight:650;margin:6px 0 12px}

/* Untere Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--faint);font-weight:600}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--brand)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 264px));bottom:calc(78px + var(--safe-b));width:58px;height:58px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 40%,transparent)}
.fab svg{width:28px;height:28px}

/* Bottom Sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,20,18,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:8px 18px calc(22px + var(--safe-b))}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.in-t{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:0}
.in-t:focus{border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mealpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mealpick button{border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:center}
.mealpick button i{width:9px;height:9px;border-radius:50%;background:var(--mc)}
.mealpick button.on{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,transparent)}
details.opt{margin:2px 0 14px}
details.opt summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:14px;list-style:none}
details.opt summary::-webkit-details-marker{display:none}
details.opt[open] summary{margin-bottom:10px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:16px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--soft);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0;text-align:center}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.nut div{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.nut small{display:block;font-size:11px;color:var(--muted)}
.nut b{font-size:15px}
.extra{font-size:13px;color:var(--muted);display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:16px}
.extra b{color:var(--ink);font-weight:600;text-align:right}
.ing{font-size:13.5px;border-top:1px solid var(--line);margin:4px 0 14px}
.ing div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ing span:last-child{color:var(--muted);white-space:nowrap}
.recent{border-top:1px solid var(--line)}
.recent .item{padding:11px 2px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw div b{display:block;font-size:15px;font-weight:600}
.sw div span{font-size:12.5px;color:var(--muted)}
.tg{position:relative;width:50px;height:30px;flex:none}
.tg input{position:absolute;opacity:0;inset:0;margin:0;z-index:2;cursor:pointer}
.tg i{position:absolute;inset:0;border-radius:30px;background:var(--line);transition:.2s}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tg input:checked + i{background:var(--brand)}
.tg input:checked + i::after{transform:translateX(20px)}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:600;font-size:16px}
.menu-item:last-child{border-bottom:0}
.menu-item svg{width:22px;height:22px;color:var(--brand)}
.menu-item span{font-weight:400;font-size:13px;color:var(--muted);display:block}
.range{width:100%;accent-color:var(--bad)}
.strength{font-size:26px;font-weight:780;text-align:center;color:var(--bad)}

/* Auswertung, Rezepte */
.cmp-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cmp-h b{font-size:16px}
.cmp-h .s{margin-left:auto;background:var(--bad-soft);color:var(--bad);font-weight:700;border-radius:10px;padding:3px 9px;font-size:13px}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.cloud span{font-size:12.5px;background:var(--soft);border-radius:8px;padding:3px 8px}
.toprow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.toprow:last-child{border-bottom:0}
.toprow .n{flex:1}
.toprow .bar{width:90px}
.toprow .bar i{background:var(--bad)}
.toprow b{width:44px;text-align:right;font-size:13px;color:var(--muted);font-weight:600}
.rc{width:100%;text-align:left}
.rc .top2{display:flex;align-items:baseline;gap:8px}
.rc .top2 b{font-size:16px}
.rc .top2 span{margin-left:auto;font-weight:700}
ol.steps{padding-left:20px;margin:6px 0 0}
ol.steps li{margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:.25s;z-index:60;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:60vh;color:var(--muted)}
.loading .sp{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin 0.9s linear infinite}
.demo{font-size:12px;text-align:center;color:var(--warn);margin:-4px 0 10px}

/* Häufig-Leiste */
.quick{margin:0 -14px 12px;padding:0 14px}
.qh{display:flex;align-items:baseline;gap:8px;margin:2px 2px 8px}
.qh b{font-size:15px}
.qh span{font-size:12.5px;color:var(--muted)}
.qs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 6px;margin:0 -14px;scrollbar-width:none}
.qs::-webkit-scrollbar{display:none}
.qc{flex:none;width:128px;scroll-snap-align:start;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:86px;position:relative;border-top:3px solid var(--mc)}
.qc:active{transform:scale(.97)}
.qc .n{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qc .v{margin-top:auto;font-size:12px;color:var(--muted)}
.qc .v b{color:var(--ink);font-size:13.5px}
.qc .plus{position:absolute;right:9px;bottom:9px;width:22px;height:22px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:16px;line-height:1}

/* Suche im Plus-Sheet */
.res-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 4px}
.res{border-top:1px solid var(--line)}
.res .item{padding:10px 2px}
.res .src{font-size:11px;color:var(--faint)}
.fallback{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fallback button{background:var(--soft);border-radius:12px;padding:11px 8px;font-weight:600;font-size:13.5px}
.fallback button small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:600;font-size:14px;margin-bottom:8px}
.back svg{width:16px;height:16px}
.portions{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.portions button{background:var(--soft);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.portions button.on{background:var(--brand);color:var(--on-brand)}
.gramrow{display:flex;align-items:center;gap:10px}
.gramrow .in-t{font-size:20px;font-weight:700;text-align:center}
.gramrow span{font-size:16px;color:var(--muted);font-weight:600}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;margin:-4px 0 14px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.acts button{background:var(--soft);border-radius:12px;padding:12px 6px;font-weight:650;font-size:14px}
.acts button.danger{color:var(--bad)}
.btn.danger{background:var(--bad)}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.facts button{background:var(--soft);border-radius:10px;padding:8px 12px;font-weight:650;font-size:14px}
.facts button.on{background:var(--brand);color:var(--on-brand)}
.banner .inb{display:block;width:100%;text-align:left;font-size:13.5px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--brand) 18%,transparent)}
.banner .inb:first-of-type{margin-top:8px}
.banner .inb span{color:var(--muted)}
.stale{font-size:12px;text-align:center;color:var(--muted);margin:-4px 0 10px}
.toast button{margin-left:12px;font-weight:700;color:var(--brand-2);text-decoration:underline}
.toast.act{pointer-events:auto}
:root[data-theme=dunkel] .toast button{color:#1E2320}
@media (prefers-color-scheme:dark){:root[data-theme=auto] .toast button{color:#1E2320}}

/* Häufig als kleine Chips im Plus */
.fchips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;max-width:190px;display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:20px;padding:7px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.fchip i{width:7px;height:7px;border-radius:50%;background:var(--mc);flex:none}
.fchip span{overflow:hidden;text-overflow:ellipsis}
.fchip small{color:var(--muted);font-weight:500}
/* Sheet: Ziehgriff und Schließen */
.sheet{touch-action:pan-y}
.grabzone{position:sticky;top:-8px;z-index:2;margin:-8px -18px 4px;padding:8px 18px 4px;background:var(--card);display:flex;align-items:center;justify-content:center}
.grabzone .grab{margin:4px auto 8px}
.xbtn{position:absolute;right:10px;top:6px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:22px;line-height:1}
.xbtn:active{background:var(--soft)}
/* Claude-Knopf */
.cbtn{position:fixed;z-index:31;right:calc(max(16px,calc(50% - 264px)) + 56px);bottom:calc(84px + var(--safe-b));width:38px;height:38px;border-radius:13px;background:var(--card);color:var(--brand);display:grid;place-items:center;box-shadow:var(--shadow);text-decoration:none}
.cbtn svg{width:19px;height:19px}
/* Theme-Auswahl */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.themes button{border:2px solid var(--line);border-radius:14px;padding:8px 6px 9px;font-size:13px;font-weight:650}
.themes button.on{border-color:var(--brand)}
.themes .sw3{display:flex;height:22px;border-radius:8px;overflow:hidden;margin-bottom:6px}
.themes .sw3 i{flex:1}
.bar.c i{background:var(--m1)} .bar.f i{background:var(--m3)}
.chip .bar{height:5px;margin-top:5px}
[hidden]{display:none!important}

.custom{background:var(--soft);border-radius:16px;padding:12px;margin:-12px 0 22px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cgrid label{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:600}
.cgrid input[type=color]{width:34px;height:34px;border:0;border-radius:10px;padding:0;background:none;flex:none}
.custom select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:14px}
.custom .f{margin-bottom:8px}

.fab{width:46px!important;height:46px!important;border-radius:16px!important;bottom:calc(80px + var(--safe-b))!important}
.fab svg{width:22px!important;height:22px!important}
#btnReload{position:relative}
#btnReload.pending::after{content:attr(data-n);position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:var(--on-brand);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#btnReload.offline::after{background:var(--warn)}
#view.sl{animation:slL .22s ease-out}#view.sr{animation:slR .22s ease-out}
@keyframes slL{from{opacity:.4;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:.4;transform:translateX(-26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view.sl,#view.sr{animation:none}}

/* Reiter: bei mehr als 5 seitlich wischbar */
.tabs .in{display:flex}
.tabs .in .tab{flex:1 0 0;min-width:0}
.tabs .in.many{overflow-x:auto;scrollbar-width:none}
.tabs .in.many::-webkit-scrollbar{display:none}
.tabs .in.many .tab{flex:0 0 auto;min-width:68px;padding-left:4px;padding-right:4px}
/* Unsichere Werte */
.unsure{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 14px;margin:0 0 12px;border-left:4px solid var(--warn)}
.unsure svg{width:20px;height:20px;color:var(--warn);flex:none}
.unsure span{flex:1}
.unsure b{display:block;font-size:14px}
.unsure small{color:var(--muted);font-size:12.5px}
.unsure svg:last-child{color:var(--faint);width:16px;height:16px}
.bdg{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-right:6px;vertical-align:1px}
.bdg.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
/* Woche: Prognose und Trefferquote */
.fc{margin-top:14px;background:var(--brand-soft);border-radius:14px;padding:10px 12px}
.fc b{display:block;font-size:14.5px}
.fc span{font-size:12.5px;color:var(--muted)}
.fc.over{background:var(--bad-soft)}
.fc.over b{color:var(--bad)}
.quote{display:flex;gap:8px;margin-top:10px}
.quote span{flex:1;background:var(--soft);border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.quote b{display:block;font-size:17px;color:var(--ink)}
/* Gewicht */
.wt-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.wt-top small{display:block;font-size:12.5px}
.wt-big{font-size:40px;font-weight:var(--head-w);font-family:var(--font-head);letter-spacing:-.03em;line-height:1.1;display:block}
.wt-big span{font-size:18px;color:var(--muted);font-weight:600}
.wt-goal{text-align:right}
.wt-goal b{font-size:20px;display:block}
.wt-add{display:grid;grid-template-columns:1fr auto;gap:8px 8px;align-items:center;margin-top:14px}
.wt-add #wKg{font-size:20px;font-weight:700;text-align:center}
.wt-add > span{color:var(--muted);font-weight:600}
.wt-add #wDate{grid-column:1}
.wt-add .btn{grid-column:2;padding:12px 16px;width:auto}
/* Scanner */
.scanbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--brand);margin-right:-6px}
.scanbtn svg{width:22px;height:22px}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:8px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanmsg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* Mehrfachauswahl */
.item.sel{background:color-mix(in srgb,var(--brand) 14%,var(--card))!important;box-shadow:inset 4px 0 0 var(--brand)}
body.selecting .fab,body.selecting .cbtn{display:none}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));z-index:40;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 6px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(94vw,520px)}
.selbar b{flex:1;font-size:14px}
.selbar button{padding:9px 12px;border-radius:12px;font-weight:700;font-size:13.5px;background:color-mix(in srgb,var(--bg) 16%,transparent)}
.selbar button:first-child{width:36px;padding:9px 0;font-size:20px;line-height:1;background:none}
.selbar .danger{background:var(--bad);color:#fff}
/* Ziehen zum Aktualisieren */
.ptr{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translate(-50%,-60px);z-index:19;width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .2s;pointer-events:none}
.ptr span{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand)}
.ptr.ready span{border-color:var(--brand)}
/* Update-Hinweis */
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:70;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:baseline;font-size:14px}
.updbar span{opacity:.85;font-size:13px}
body{overscroll-behavior-y:contain}
</style>
</head>

];

  anleitungen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  beschwerden:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',

function groupItems(items){
  const out=[],rec={};
  items.slice().sort((a,b)=>a.time.localeCompare(b.time)).forEach(e=>{
    if(!e.recipe){out.push({single:e,time:e.time});return;}
    let g=rec[e.recipe];
    if(!g){g=rec[e.recipe]={recipe:e.recipe,rows:[],kcal:0,p:0,c:0,f:0,time:e.time,amount:(e.amount||'').split('(')[0].trim()};out.push(g);}
    g.rows.push(e);g.kcal+=e.kcal;g.p+=e.p;g.c+=e.c;g.f+=e.f;
  });
  return out;
}

/* Bereits Gegessenes: je Produkt bzw. Rezept der letzte Eintrag, mit Häufigkeit */
function recentList(){
  if(S.recentCache)return S.recentCache;
  const rows=S.data.diary,groups=new Map();
  for(const r of rows){
    const key=r[10]?'R|'+r[10]+'|'+r[1]+'|'+r[3]:'S|'+r[0];
    if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r);
  }
  const items=new Map(),from=addDays(today(),-60);
  for(const grp of groups.values()){
    const r=grp[0],id=r[10]?'R|'+r[10]:'S|'+r[4]+'|'+r[5];
    const cur=items.get(id)||{count:0,recent:0};
    const v={recipe:r[10]||'',name:r[4],amount:r[10]?(r[5]||'').split('(')[0].trim():r[5],rows:grp.map(x=>x[0]),kcal:grp.reduce((a,x)=>a+x[6],0),p:grp.reduce((a,x)=>a+x[7],0),last:r[1],time:r[2],meal:r[3]};
    const isNewer=!cur.last||(r[1]+r[2])>=(cur.last+cur.time);
    const n=Object.assign({},isNewer?v:cur,{count:cur.count+1,recent:cur.recent+(r[1]>=from?1:0)});
    items.set(id,n);
  }
  S.recentCache=[...items.values()].sort((a,b)=>(b.last+b.time).localeCompare(a.last+a.time));
  return S.recentCache;
}
function frequent(){
  if(S.freq)return S.freq;
  S.freq=recentList().filter(x=>x.recent>=2).sort((a,b)=>b.recent-a.recent||(b.last+b.time).localeCompare(a.last+a.time)).slice(0,15);
  if(S.freq.length<8)S.freq=S.freq.concat(recentList().filter(x=>!S.freq.includes(x)).slice(0,10-S.freq.length));
  return S.freq;
}

function loadFoods(){
  if(S.foods)return Promise.resolve(S.foods);

  const c=store.get(FOODS);
  if(c&&c.count===S.data.foodsCount){S.foods=prepFoods(c.foods);return Promise.resolve(S.foods);}
  S.foodsP=call('getFoods').then(r=>{store.set(FOODS,r);S.foods=prepFoods(r.foods);S.foodsP=null;return S.foods;}).catch(e=>{S.foodsP=null;throw e;});
  return S.foodsP;
}
const norm=s=>String(s||'').toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
function prepFoods(list){return list.map(f=>({f,k:norm(f[0]+' '+f[1])}));}
function searchFoods(q){
  const t=norm(q).split(/[\s,]+/).filter(Boolean);if(!t.length||!S.foods)return [];
  const out=[];
  for(const x of S.foods){
    if(!t.every(w=>x.k.includes(w)))continue;
    const n=norm(x.f[0]);let sc=n.length/12+(x.f[1]?1.5:0);
    if(n.startsWith(t[0]))sc-=6;else if(n.includes(' '+t[0])||n.includes(','+t[0]))sc-=2;
    if(/roh\b/.test(n))sc-=.5;if(x.f[9])sc-=.5;if(x.f[11]!==null)sc-=.5;
    out.push([sc,x.f]);
  }
  return out.sort((a,b)=>a[0]-b[0]).slice(0,40).map(x=>x[1]);
}
const r1=v=>Math.round(v*10)/10;
function foodRow(fd,g,meal,date,time,portion){

}

function ring(eaten,goal){

  <circle cx="66" cy="66" r="${r}" fill="none" stroke="${over?'var(--bad)':'var(--brand)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>

}

/* ================= Sofort-Änderungen + Speichern im Hintergrund =================
   Jede Änderung wird sofort lokal angezeigt und in eine Warteschlange gelegt.
   Die Warteschlange wird der Reihe nach ans Sheet geschickt (auch nach App-Neustart
   oder wenn kurz kein Netz da ist). Danach holt die App einmal still den echten Stand. */
const Q={q:[],map:{},seq:1,busy:false,ver:0,fails:0};
(function(){const s=store.get('et-queue');if(s){Q.q=s.q||[];Q.map=s.map||{};Q.seq=s.seq||1;}})();
function qSave(){store.set('et-queue',{q:Q.q,map:Q.map,seq:Q.seq});}
const newTmp=p=>p+(Q.seq++)+'-'+Date.now().toString(36);
const resolveId=v=>typeof v==='string'?(Q.map[v]!==undefined?Q.map[v]:null):v;
function findRow(id){const real=resolveId(id);return S.data.diary.find(r=>r[0]===id||(real!==null&&r[0]===real));}

const NUMI=[6,7,8,9,11,12,13,15,16];
const scl=(v,i,f)=>v===''||v===null?v:(i===6?Math.round(v*f):r1(v*f));
function scaleAmount(txt,f){
  txt=String(txt||'');if(f===1)return txt;
  const fmt=n=>String(r1(n)).replace('.',','),nm=a=>parseFloat(a.replace(',','.')),gram=/(\d+(?:[.,]\d+)?)(\s*)(g|ml)\b/;
  const lead=txt.match(/^(ca\.\s*)?(\d+(?:[.,]\d+)?)/);
  if(lead){const rest=txt.slice(lead[0].length);
    if(/von \d+(?:[.,]\d+)? Portion/.test(txt)||/^\s*(g|ml)\b/.test(rest))return (lead[1]||'')+fmt(nm(lead[2])*f)+rest;
    return (lead[1]||'')+fmt(nm(lead[2])*f)+rest.replace(gram,(m,a,sp,u)=>fmt(nm(a)*f)+sp+u);}
  if(gram.test(txt))return txt.replace(gram,(m,a,sp,u)=>fmt(nm(a)*f)+sp+u);
  return fmt(f)+' × '+txt;
}

/* Lokale Änderungen am Datenstand (gleiche Logik wie im Script) */
const L={
  addEntries(rows){const temp=rows.map(r=>{const id=newTmp('t');S.data.diary.push([id].concat(r));return id;});return {temp};},
  repeatRows(rows,date,time,meal,f){f=f||1;const temp=[];
    rows.forEach(id=>{const src=findRow(id);if(!src)return;const n=src.slice();n[0]=newTmp('t');n[1]=date;n[2]=time;n[3]=meal;
      if(f!==1){NUMI.forEach(i=>n[i]=scl(n[i],i,f));n[5]=scaleAmount(n[5],f);}S.data.diary.push(n);temp.push(n[0]);});
    return {temp};},
  updateRows(items,f,meal,date,time){items.forEach(it=>{const r=findRow(it.row);if(!r)return;if(date)r[1]=date;if(time)r[2]=time;if(meal)r[3]=meal;
    if(f&&f!==1){NUMI.forEach(i=>r[i]=scl(r[i],i,f));r[5]=scaleAmount(r[5],f);}});return {};},
  deleteRows(items){
    const ids=new Set(items.map(it=>{const r=findRow(it.row);return r?r[0]:null;}));
    const nums=[...ids].filter(x=>typeof x==='number').sort((a,b)=>a-b);
    S.data.diary=S.data.diary.filter(r=>!ids.has(r[0]));
    if(nums.length)S.data.diary.forEach(r=>{if(typeof r[0]==='number'){let n=0;for(const d of nums)if(d<r[0])n++;r[0]-=n;}});
    return {};},
  addInbox(e){const id=newTmp('i');S.data.inbox.push(Object.assign({row:id},e));return {temp:[id]};},
  updateInbox(row,e){const it=S.data.inbox.find(x=>x.row===row||x.row===resolveId(row));if(it)Object.assign(it,e);return {};},
  deleteInbox(row){S.data.inbox=S.data.inbox.filter(x=>x.row!==row&&x.row!==resolveId(row));return {};},
  addComplaint(c){S.data.complaints.push(c);return {};},
  addWeight(w){const id=newTmp('w');(S.data.weights=S.data.weights||[]).push(Object.assign({row:id},w));return {temp:[id]};},
  deleteWeight(it){const real=resolveId(it.row);const hit=S.data.weights.find(x=>x.row===it.row||(real!==null&&x.row===real));if(!hit)return {};
    S.data.weights=S.data.weights.filter(x=>x!==hit);if(typeof hit.row==='number')S.data.weights.forEach(x=>{if(typeof x.row==='number'&&x.row>hit.row)x.row--;});return {};},
  addFood(rec){if(S.foods){S.foods.push({f:foodFromRow(rec),k:norm(rec[0]+' '+rec[1])});}S.data.foodsCount=(S.data.foodsCount||0)+1;
    const c=store.get(FOODS);if(c){c.foods.push(foodFromRow(rec));c.count=S.data.foodsCount;store.set(FOODS,c);}return {};},
  saveGoals(g){S.data.goals={kcalDay:g.kcalDay,proteinDay:g.proteinDay,kcalWeek:g.kcalWeek};S.data.settings.goals2={carbs:g.carbs||0,fat:g.fat||0,weight:g.weight||0};return {};},
  saveSettings(s){S.data.settings=s;return {};}
};

/* Änderung übernehmen: sofort anzeigen, im Hintergrund speichern */
function commit(fn,args){
  const out=L[fn](...JSON.parse(JSON.stringify(args)));
  index();render();
  if(LIVE){
    Q.q.push({fn,args,temp:out.temp||null});Q.ver++;qSave();
    store.set(CACHE,{t:Date.now(),d:S.data});
    pump();
  }
  return out;
}
function resolveArgs(op){
  const a=JSON.parse(JSON.stringify(op.args));
  const must=v=>{const r=resolveId(v);if(r===null||r===undefined)throw new Error('Eintrag wurde nicht gespeichert.');return r;};
  if(op.fn==='repeatRows')a[0]=a[0].map(must);
  if(op.fn==='updateRows'||op.fn==='deleteRows')a[0]=a[0].map(it=>Object.assign({},it,{row:must(it.row)}));
  if(op.fn==='updateInbox'||op.fn==='deleteInbox')a[0]=must(a[0]);
  if(op.fn==='deleteWeight')a[0]=Object.assign({},a[0],{row:must(a[0].row)});
  return a;
}
function pump(){
  if(!LIVE||Q.busy||!Q.q.length){updateSyncBadge();return;}
  Q.busy=true;updateSyncBadge();
  const op=Q.q[0];let args;
  try{args=resolveArgs(op);}catch(e){Q.q.shift();qSave();Q.busy=false;toast('Konnte nicht speichern: '+e.message,true);Q.ver++;pump();scheduleResync(true);return;}
  api(CONN.url,CONN.key,op.fn,args).then(r=>{
    if(op.temp&&r){const real=r.added||(r.row!=null?[r.row]:[]);op.temp.forEach((t,i)=>{if(real[i]!=null)Q.map[t]=real[i];});}
    if(op.fn==='deleteWeight'){const d=args[0].row;for(const key in Q.map){const v=Q.map[key];if(key[0]==='w'&&typeof v==='number'&&v>d)Q.map[key]=v-1;}}
    if(op.fn==='deleteRows'){const del=args[0].map(i=>i.row).sort((x,y)=>x-y);
      for(const key in Q.map){const v=Q.map[key];if(key[0]==='t'&&typeof v==='number'){let n=0;for(const d of del)if(d<v)n++;Q.map[key]=v-n;}}}
    Q.q.shift();Q.fails=0;qSave();Q.busy=false;
    if(Q.q.length)pump();else{updateSyncBadge();scheduleResync();}
  }).catch(e=>{
    Q.busy=false;
    if(e.net){Q.fails++;updateSyncBadge();if(Q.fails===1)toast('Gerade keine Verbindung. Wird gespeichert, sobald wieder Netz da ist.');setTimeout(pump,Math.min(60000,4000*Q.fails));}
    else{Q.q.shift();qSave();toast('Nicht gespeichert: '+e.message,true);Q.ver++;if(Q.q.length)pump();else scheduleResync(true);}
  });
}
function updateSyncBadge(){
  const b=$('#btnReload');if(!b)return;
  const n=Q.q.length;b.dataset.n=n?String(n):'';b.classList.toggle('pending',!!n);b.classList.toggle('offline',!!n&&Q.fails>0);
  b.classList.toggle('spin',Q.busy&&!Q.fails);
}
/* Stiller Abgleich mit dem Sheet, wenn nichts mehr wartet */
function scheduleResync(now){
  clearTimeout(Q.rt);
  Q.rt=setTimeout(()=>resync(),now?200:1500);
}
function resync(manual){
  if(!LIVE)return Promise.resolve();
  if(Q.q.length||Q.busy){if(manual)toast('Speichere noch '+Q.q.length+' Änderung'+(Q.q.length>1?'en':'')+' …');pump();return Promise.resolve();}
  const v=Q.ver;if(manual)$('#btnReload').classList.add('spin');
  return api(CONN.url,CONN.key,'getData',[]).then(d=>{
    $('#btnReload').classList.remove('spin');S.lastSync=Date.now();
    if(Q.ver===v&&!Q.q.length){if(S.older){S.data=d;mergeOlder();d=S.data;}apply(d);if(manual)toast('Aktualisiert');}
  }).catch(e=>{$('#btnReload').classList.remove('spin');if(manual)toast(e.message,true);});
}
window.addEventListener('online',()=>pump());

/* Lebensmittel-Zeile (A-P) in das Suchformat der App umwandeln */
function foodFromRow(r){const o=v=>v===''||v===null||v===undefined?null:Number(v);
  return [r[0],r[1],Number(r[2])||0,Number(r[3])||0,Number(r[4])||0,o(r[5]),Number(r[6])||0,o(r[7]),r[8]||'',o(r[9]),r[10]||'',o(r[12]),r[13]||'',o(r[14]),o(r[15])];}
function vibe(ms){try{navigator.vibrate&&navigator.vibrate(ms||12);}catch(e){}}
/* ================= Woche ================= */
function weekAgg(mon){
  const r={kcal:0,p:0,c:0,f:0,days:0,meals:{}};MEALS.forEach(m=>r.meals[m]={kcal:0,p:0});
  for(let i=0;i<7;i++){const d=day(addDays(mon,i));if(d.n){r.days++;}r.kcal+=d.kcal;r.p+=d.p;r.c+=d.c;r.f+=d.f;MEALS.forEach(m=>{if(d.meals[m]){r.meals[m].kcal+=d.meals[m].kcal;r.meals[m].p+=d.meals[m].p;}});}
  return r;
}
function stackBar(d,max,goal){
  let s='<div class="stack">';
  MEALS.forEach(m=>{const v=d.meals[m]?d.meals[m].kcal:0;if(v>0)s+=`<i style="width:${v/max*100}%;background:${MEAL_COLOR[m]}"></i>`;});
  if(goal) s+=`<span class="goal" style="left:${Math.min(100,goal/max*100)}%"></span>`;
  return s+'</div>';
}
/* Prognose fürs Wochenende und Trefferquote */
function hitRate(days){
  const g=S.data.goals,d=days.map(day).filter(x=>x.n);
  return {n:d.length,kcal:d.filter(x=>x.kcal<=g.kcalDay).length,p:d.filter(x=>x.p>=g.proteinDay).length};
}
function weekForecast(mon){
  const g=S.data.goals,t=today(),days=[];for(let i=0;i<7;i++)days.push(addDays(mon,i));
  const hr=hitRate(days.filter(s=>s<=t));
  let fc='';
  if(days.includes(t)){
    const before=days.filter(s=>s<t),done=before.map(day).filter(x=>x.n);
    if(done.length>=2){
      const avg=done.reduce((a,x)=>a+x.kcal,0)/done.length,sum=before.reduce((a,s)=>a+day(s).kcal,0);
      const est=sum+Math.max(avg,day(t).kcal)+avg*days.filter(s=>s>t).length,over=est>g.kcalWeek;
      fc=`<div class="fc ${over?'over':''}"><b>Prognose: etwa ${k(Math.round(est/50)*50)} kcal</b><span>${over?'Das wären '+k(est-g.kcalWeek)+' über dem Wochenziel.':'Damit bleibst du '+k(g.kcalWeek-est)+' unter dem Wochenziel.'} Grundlage: dein Schnitt der bisherigen Tage.</span></div>`;
    }
  }
  const q=hr.n?`<div class="quote"><span><b class="num">${hr.kcal}/${hr.n}</b> Tage im kcal-Ziel</span><span><b class="num">${hr.p}/${hr.n}</b> Tage Eiweiß-Ziel</span></div>`:'';
  return fc+q;
}

function weights(){return (S.data.weights||[]).slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));}
function kgAt(list,dateISO){let v=null;for(const w of list){if(w.date<=dateISO)v=w.kg;else break;}return v;}
const kg1=v=>v===null||v===undefined?'–':nf1.format(v);
function weightChart(list){
  const t=today(),from=addDays(t,-89),pts=list.filter(w=>w.date>=from);
  if(pts.length<2)return '<div class="faint small" style="padding:18px 0;text-align:center">Ab zwei Einträgen erscheint hier die Kurve der letzten 90 Tage.</div>';
  const W=340,H=170,pl=30,pr=8,pt=10,pb=20,goal=g2().weight||0;
  let lo=Math.min(...pts.map(p=>p.kg)),hi=Math.max(...pts.map(p=>p.kg));
  if(goal&&goal>lo-3&&goal<hi+3){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);
  const x=d=>pl+(W-pl-pr)*((parse(d)-parse(from))/(parse(t)-parse(from))),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const avg=pts.map((p,i)=>{const s=pts.filter(q=>q.date<=p.date&&q.date>addDays(p.date,-7));return [p.date,s.reduce((a,q)=>a+q.kg,0)/s.length];});
  const line=a=>a.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<text x="${pl-6}" y="${y(v)+3}" font-size="9.5" text-anchor="end" fill="var(--faint)">${nf1.format(v)}</text><line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join('');
  const xl=[from,addDays(t,-45),t].map(d=>`<text x="${x(d)}" y="${H-4}" font-size="9.5" text-anchor="middle" fill="var(--faint)">${shortDate(d)}</text>`).join('');
  const gl=goal?`<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--prot)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(goal)-4}" font-size="9.5" text-anchor="end" fill="var(--prot)">Ziel ${nf1.format(goal)}</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}">${ticks}${gl}<path d="${line(avg)}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="2.6" fill="var(--card)" stroke="var(--brand)" stroke-width="1.5" opacity=".8"/>`).join('')}${xl}</svg>`;
}
function vGewicht(){

  const dl=(v,l)=>`<div><small>${l}</small><b class="num" style="${v===null?'':v<0?'color:var(--brand)':v>0?'color:var(--warn)':''}">${v===null?'–':(v>0?'+':v<0?'−':'±')+nf1.format(Math.abs(v))+' kg'}</b></div>`;

/* ================= Barcode-Scanner =================
   Kamera + eingebauter Barcode-Leser von Chrome (BarcodeDetector).
   Produktwerte kommen von Open Food Facts (freie Produktdatenbank). */
const SCAN={stream:null,timer:null,det:null};
function stopScan(){
  clearInterval(SCAN.timer);SCAN.timer=null;
  if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null;}
}
function scanHtml(){
  const can='BarcodeDetector' in window&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
  return `<button class="back" data-act="addback">${ICON.back}Zurück</button><h2>Barcode scannen</h2>
    ${can?`<div class="scanbox"><video id="scanVid" playsinline muted></video><div class="scanframe"></div><div class="scanmsg" id="scanMsg">Kamera wird gestartet …</div></div>`:
      `<p class="sub">Dein Browser kann hier keine Barcodes lesen. Gib die Nummer unter dem Strichcode einfach ein.</p>`}
    <label class="f" style="margin-top:12px"><span>Oder Nummer eingeben</span><div class="gramrow"><input class="in-t num" id="eanIn" inputmode="numeric" placeholder="z. B. 4001234567890" style="font-size:16px;text-align:left"><button class="btn" style="width:auto;padding:12px 16px" data-act="eanGo">Suchen</button></div></label>`;
}
function startScan(){
  const v=$('#scanVid');if(!v)return;
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(st=>{
    if(!$('#scanVid')){st.getTracks().forEach(t=>t.stop());return;}
    SCAN.stream=st;v.srcObject=st;v.play();$('#scanMsg').textContent='Strichcode in den Rahmen halten';
    SCAN.det=SCAN.det||new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    SCAN.timer=setInterval(()=>{
      if(v.readyState<2)return;
      SCAN.det.detect(v).then(c=>{if(c&&c.length&&SCAN.timer){const code=c[0].rawValue;stopScan();vibe(30);lookupEan(code);}}).catch(()=>{});
    },220);
  }).catch(e=>{const m=$('#scanMsg');if(m)m.textContent='Kein Kamerazugriff. Bitte in Chrome erlauben oder die Nummer eingeben.';});
}
const SWEET={sucralose:'Sucralose',aspartam:'Aspartam',acesulfam:'Acesulfam K',steviolglycosid:'Steviolglycoside',stevia:'Stevia',cyclamat:'Cyclamat',saccharin:'Saccharin',neotam:'Neotam',erythrit:'Erythrit',maltit:'Maltit',sorbit:'Sorbit',xylit:'Xylit',isomalt:'Isomalt',lactit:'Lactit'};
function sweetFrom(txt){
  if(!txt)return '';const t=norm(txt),hit=[];
  for(const k in SWEET)if(t.includes(k)&&!hit.includes(SWEET[k]))hit.push(SWEET[k]);
  return hit.length?'ja ('+hit.join(', ')+')':'nein';
}
function lookupEan(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length<8){toast('Bitte eine gültige Barcode-Nummer eingeben.',true);return;}
  const local=S.foods&&S.foods.find(x=>String(x.f[10]).includes(code));
  if(local){pickScanned(local.f,code,true);return;}
  const A=S.add;A.step='scanwait';
  openSheet(`<button class="back" data-act="addback">${ICON.back}Zurück</button><h2>Suche Produkt …</h2><p class="sub">Barcode ${esc(code)}</p><div class="loading" style="height:120px"><div class="sp"></div></div>`);
  const f='product_name,product_name_de,generic_name_de,brands,nutriments,serving_quantity,serving_size,ingredients_text_de,ingredients_text';
  fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields='+f).then(r=>r.json()).then(j=>{
    const p=j&&j.status===1&&j.product,n=p&&p.nutriments;
    if(!p||!n||n['energy-kcal_100g']===undefined){notFound(code);return;}
    const o=v=>v===undefined||v===null||v===''?null:Math.round(Number(v)*10)/10;
    const ingr=p.ingredients_text_de||p.ingredients_text||'';
    const salt=n.salt_100g!==undefined?o(n.salt_100g):n.sodium_100g!==undefined?o(n.sodium_100g*2.5):null;
    const caff=ingr?(/(koffein|coffein|caffeine|kaffee|guarana|mate|cola|tee\b)/i.test(ingr)?null:0):null;
    const sq=Number(p.serving_quantity)||null;
    const name=(p.product_name_de||p.product_name||p.generic_name_de||'Produkt').trim(),brand=String(p.brands||'').split(',')[0].trim();
    const rec=[name,brand,Math.round(Number(n['energy-kcal_100g'])||0),o(n.proteins_100g)||0,o(n.carbohydrates_100g)||0,o(n.sugars_100g),o(n.fat_100g)||0,o(n.fiber_100g),
      sq?'Portion':'',sq,'Open Food Facts (EAN '+code+')',salt,sweetFrom(ingr),o(n.lactose_100g),caff];
    pickScanned(rec,code,false);
  }).catch(()=>{toast('Produktdatenbank gerade nicht erreichbar.',true);notFound(code);});
}
function notFound(code){
  S.add.step='scan';S.add.q='EAN '+code;
  openSheet(`<button class="back" data-act="addback">${ICON.back}Zurück</button><h2>Nicht gefunden</h2><p class="sub">Zum Barcode ${esc(code)} gibt es keine Nährwerte in der Produktdatenbank.</p>
    <div class="fallback"><button data-act="addstep" data-step="manual">Packungswerte eingeben<small>von der Verpackung abtippen</small></button><button data-act="addstep" data-step="claude">An Claude übergeben<small>Claude sucht die Werte</small></button></div>`);
}

(function(){

/* ================= Aktionen ================= */
function toast(msg,err,action){
  const t=$('#toast');t.innerHTML=esc(msg)+(action?`<button id="tAct">${esc(action.label)}</button>`:'');
  t.className='toast on'+(err?' err':'')+(action?' act':'');
  if(action)$('#tAct').onclick=()=>{t.className='toast';action.fn();};
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',action?6000:err?4500:2600);
}
function busy(on){$('#btnReload').classList.toggle('spin',on);}
function apply(data,fromCache){S.data=data;applyTheme(data.settings&&data.settings.theme,data.settings&&data.settings.custom);if(!fromCache&&LIVE)store.set(CACHE,{t:Date.now(),d:data});index();render();}
function run(fn,args,ok,keepOpen){
  busy(true);
  const btn=document.activeElement&&document.activeElement.classList.contains('btn')?document.activeElement:null;if(btn)btn.disabled=true;
  return call(fn,...args).then(d=>{busy(false);if(d&&d.diary)apply(d);if(!keepOpen)closeSheet();if(ok)toast(ok);return d;})
    .catch(e=>{busy(false);if(btn)btn.disabled=false;toast((e&&e.message)||String(e),true);return null;});
}
function undoTemp(temp){
  const items=(temp||[]).map(t=>{const r=findRow(t);return r&&{row:r[0],date:r[1],name:r[4]};}).filter(Boolean);

}

/* Mehrfachauswahl (lange drücken) */
function startSel(x,el){S.selMode=true;S.selected=new Map();toggleSel(x,el);vibe(25);}
function toggleSel(x,el){
  const key=selKey(x);if(S.selected.has(key))S.selected.delete(key);else S.selected.set(key,x);
  if(el)el.classList.toggle('sel',S.selected.has(key));
  if(!S.selected.size){endSel();return;}
  let bar=$('#selbar');if(!bar){bar=document.createElement('div');bar.id='selbar';bar.className='selbar';document.body.appendChild(bar);}
  bar.innerHTML=`<button data-act="selCancel" aria-label="Auswahl beenden">×</button><b>${S.selected.size} ausgewählt</b><button data-act="selMove">Verschieben</button><button class="danger" data-act="selDel">Löschen</button>`;
  document.body.classList.add('selecting');
}
function endSel(){S.selMode=false;S.selected=null;const b=$('#selbar');if(b)b.remove();document.body.classList.remove('selecting');document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));}
(function(){
  let t=null,sx=0,sy=0;
  document.addEventListener('touchstart',e=>{
    const el=e.target.closest('#view .item[data-act=item]');if(!el||S.sheetOpen)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    t=setTimeout(()=>{t=null;const x=S.items[el.dataset.id];if(!x)return;S.suppressClick=true;if(S.selMode)toggleSel(x,el);else startSel(x,el);},480);
  },{passive:true});
  document.addEventListener('touchmove',e=>{if(t&&(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10)){clearTimeout(t);t=null;}},{passive:true});
  document.addEventListener('touchend',()=>{if(t){clearTimeout(t);t=null;}},{passive:true});
  document.addEventListener('contextmenu',e=>{if(e.target.closest('#view .item'))e.preventDefault();});
})();

const AUFTRAG='Auftrag: Nachpflegen – alle vorläufigen und unvollständigen Einträge genau nachschlagen, sonst sinnvoll schätzen.';
function queueAuftrag(){
  if((S.data.inbox||[]).some(i=>/^Auftrag: Nachpflegen/.test(i.what)))return;
  if((S.data.inbox||[]).length>=10){toast('Der Eingang ist voll.',true);return;}
  commit('addInbox',[{what:AUFTRAG,amount:'',meal:'',date:today(),time:nowHM()}]);
}
function openNachpflegen(){
  const u=unsureList(),pre=u.filter(isPrelim).length,inc=u.length-pre;
  openSheet(`<h2>Von Claude nachpflegen lassen</h2>
    <p class="sub">${pre?pre+' '+(pre===1?'Eintrag ist':'Einträge sind')+' als vorläufig markiert':''}${pre&&inc?', ':''}${inc?inc+' '+(inc===1?'Eintrag hat':'Einträge haben')+' fehlende Werte (z. B. Salz oder Süßstoff)':''}. Claude schlägt sie nach und schätzt, was nicht auffindbar ist.</p>

    getFoods:()=>({count:data.foodsCount,foods}),
    saveSettings:s=>{data.settings=s;return s;},
    saveGoals:g=>{data.goals={kcalDay:g.kcalDay,proteinDay:g.proteinDay,kcalWeek:g.kcalWeek};data.settings.goals2={carbs:g.carbs||0,fat:g.fat||0};return out();},
    addInbox:e=>{if(data.inbox.length>=10)throw new Error('Der Eingang ist voll.');data.inbox.push(Object.assign({row:5+data.inbox.length},e));return out();},
    updateInbox:(row,e)=>{const i=data.inbox.find(x=>x.row===row);Object.assign(i,e);return out();},
    deleteInbox:row=>{data.inbox=data.inbox.filter(x=>x.row!==row);return out();},
    addComplaint:c=>{data.complaints.push(c);return out();},
    repeatRows:(rows,date,time,meal,f)=>{f=f||1;const added=[];rows.forEach(r=>{const src=data.diary.find(x=>x[0]===r);if(!src)return;const n=src.slice();n[0]=next++;n[1]=date;n[2]=time;n[3]=meal;
      if(f!==1){NUM.forEach(i=>n[i]=sc(n[i],i,f));n[5]=scaleAmount(n[5],f);}data.diary.push(n);added.push(n[0]);});return out(added);},
    addEntries:rows=>{const added=rows.map(r=>{const n=[next++].concat(r);data.diary.push(n);return n[0];});return out(added);},
    updateRows:(items,f,meal,date,time)=>{items.forEach(it=>{const r=find(it);if(date)r[1]=date;if(time)r[2]=time;if(meal)r[3]=meal;if(f&&f!==1){NUM.forEach(i=>r[i]=sc(r[i],i,f));r[5]=scaleAmount(r[5],f);}});return out();},
    deleteRows:items=>{items.forEach(find);const set=new Set(items.map(i=>i.row));data.diary=data.diary.filter(r=>!set.has(r[0]));return out();}
  };
})();

/* ================= Start: sofort den letzten Stand zeigen, dann frisch laden ================= */
function connectScreen(){
  $('#tabs').innerHTML='';$('#fab').hidden=true;$('#cbtn').hidden=true;$('#btnMore').hidden=true;$('#btnReload').hidden=true;$('#btnSettings').hidden=true;
  $('#title').textContent='Ernährungstagebuch';
  $('#view').innerHTML=`<div class="card"><h3>App verbinden</h3><p class="small muted" style="margin-top:0">Einmalig: Web-App-URL und Schlüssel aus dem Apps-Script-Editor einfügen. Beides bleibt nur auf diesem Gerät gespeichert.</p>
    <label class="f"><span>Web-App-URL</span><input class="in-t" id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label class="f"><span>Schlüssel</span><input class="in-t" id="cKey" placeholder="aus dem Ausführungsprotokoll" autocomplete="off"></label>
    <button class="btn" data-act="connect">Verbinden</button>
    <button class="more" style="margin-top:12px" data-act="demo">Erst mal mit Beispieldaten ansehen</button></div>`;
}
(function start(){
  if(!LIVE&&!DEMO){connectScreen();return;}
  const cached=LIVE?store.get(CACHE):null;
  if(cached&&cached.d){apply(cached.d,true);updateSyncBadge();
    if(Q.q.length)pump();else resync();
    setTimeout(()=>loadFoods().catch(()=>{}),1500);return;}
  call('getData').then(d=>{busy(false);S.lastSync=Date.now();apply(d);if(Q.q.length)pump();setTimeout(()=>loadFoods().catch(()=>{}),1200);})
    .catch(e=>{busy(false);if(cached){S.stale=null;render();toast('Keine Verbindung, zeige gespeicherten Stand.',true);}
      else $('#view').innerHTML=`<div class="card"><b>Konnte das Tagebuch nicht laden.</b><p class="small muted">${esc(e.message||e)}</p></div>`;});
})();

/* Offline-Hilfe registrieren und auf neue Versionen hinweisen */
(function(){
  if(!('serviceWorker' in navigator)||location.protocol!=='https:'||window.PREVIEW||window.DEMO)return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=()=>{
      if(document.getElementById('updbar'))return;
      const b=document.createElement('button');b.id='updbar';b.className='updbar';
      b.innerHTML='<b>Neue Version da</b><span>Tippen zum Laden</span>';
      b.onclick=()=>{if(reg.waiting)reg.waiting.postMessage('skip');else location.reload();};
      document.body.appendChild(b);
    };
    if(reg.waiting&&navigator.serviceWorker.controller)show();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show();});});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  }).catch(()=>{});
})();
</script>
